# Vendored upstream windows-rs / Windows Reactor sources used by the opt-in
# WinUI 3 backend (`third_party/windows-winui/`, see its VENDORED.md). They are
# PATH DEPENDENCIES of `perry-ui-windows-winui`, not Perry crates: excluding
# them keeps them out of the workspace member set, so `cargo test --workspace`
# never compiles them and Perry's `[workspace.lints]` policy is never applied
# to third-party code. `perry-ui-windows-winui` still resolves them normally
# through its `path = "../../third_party/..."` dependency edge.
#
# They live OUTSIDE `crates/` on purpose. Cargo's `exclude` loses to an
# explicit `members` entry that is a path PREFIX of the excluded directory
# (`is_excluded` returns `!explicit_member && excluded`), so while these sat in
# `crates/perry-ui-windows-winui/vendor/` they were implicit members and NO
# `exclude` entry could remove them. Keeping them out of `crates/` also keeps
# them out of the `crates/perry-ui*` globs used by the GC/lint census gates.
exclude = [
    "third_party/windows-winui",
]

# Build only the host-independent product set by default.
# Platform UI manifests keep their source and dependencies behind target cfgs.
# Build each platform package explicitly for its applicable target.
default-members = [
    "crates/perry",
    "crates/perry-container-compose",
]

# Aggressive release optimizations for small, fast binaries
[profile.release]
lto = "thin"          # Thin LTO for faster builds and fewer duplicate symbols
codegen-units = 1     # Better optimization, slower compile
# panic=abort (#7302): the invoke/landingpad exception transport requires the
# unwinder to step THROUGH runtime Rust frames with longjmp-equivalent
# semantics — no cleanups, and no RFC-2945 abort-on-unwind guards (which
# panic=unwind plants in every extern "C" helper and which a JS throw
# crossing a helper frame would trip). Must be paired with
# `-C force-unwind-tables=yes` (.cargo/config.toml) or the unwinder cannot
# step the frames at all — js_eh_try_push self-checks this at runtime and
# fails loudly. Cost: catch_unwind-based panic recovery (spawn workers,
# worker_threads, UI callbacks) no longer catches — a runtime panic aborts
# the process. On the main JS→helper path panics already aborted (the
# RFC-2945 guards); cargo test is unaffected (test builds force unwind).
panic = "abort"
strip = true          # Strip symbols automatically
opt-level = 3         # Maximum optimization

# For the runtime/stdlib static libraries
[profile.release.package.perry-runtime]
opt-level = 3
strip = false

# UI crates must NOT strip — they export #[no_mangle] extern "C" symbols
[profile.release.package.perry-ui-macos]
strip = false
codegen-units = 1

[profile.release.package.perry-ui-gtk4]
strip = false
codegen-units = 1

[profile.release.package.perry-ui-windows]
strip = false
codegen-units = 1

# WinUI scaffold (#4680): re-exports perry-ui-windows; the staticlib bundles
# its #[no_mangle] extern "C" symbols, so it must not be stripped either.
[profile.release.package.perry-ui-windows-winui]
strip = false
codegen-units = 1

[profile.release.package.perry-ui-geisterhand]
strip = false
codegen-units = 1

[profile.release.package.perry-ui-ios]
strip = false
codegen-units = 1

[profile.release.package.perry-ui-visionos]
strip = false
codegen-units = 1

[profile.release.package.perry-ui-tvos]
strip = false
codegen-units = 1

[profile.release.package.perry-ui-android]
strip = false
codegen-units = 1

[profile.release.package.perry-ui-watchos]
strip = false
codegen-units = 1

[profile.release.package.perry-stdlib]
opt-level = "s"       # Optimize for size in stdlib

# perry-ext-events exports #[no_mangle] EventEmitter FFI symbols
# (js_event_emitter_*) that generated native code calls directly when a program
# constructs a native EventEmitter by name (e.g. eventemitter3's default
# export). It is a non-tokio wrapper, so the auto-optimize linker uses its
# prebuilt standalone staticlib rather than rebuilding it alongside a crate that
# references those symbols. Thin-LTO then internalizes and drops the whole C API
# from that staticlib, so the program fails to link with undefined
# _js_event_emitter_* symbols (#5140). Mirror the UI crates' settings (which
# export #[no_mangle] extern "C" symbols for the same reason): more codegen
# units + no strip keeps the exported C API in the staticlib.
[profile.release.package.perry-ext-events]
strip = false
codegen-units = 1

# Staticlib wrapper crates (#5422). perry-runtime / perry-stdlib are now
# rlib-only; these wrappers re-export their #[no_mangle] C API into
# libperry_runtime.a / libperry_stdlib.a. Thin-LTO would otherwise internalize
# and drop the whole exported C surface (same failure as perry-ext-events,
# #5140), so mirror its settings: more codegen units + no strip keep the C API
# in the archive.
[profile.release.package.perry-runtime-static]
strip = false
codegen-units = 1
[profile.release.package.perry-stdlib-static]
strip = false
codegen-units = 1

# Issue #5928: well-known "shared tokio" wrapper crates (#507) are built in
# the SAME cargo invocation as perry-stdlib-static so cargo unifies their
# shared dependency graph (tokio, hyper_util, rustls, and even core/std
# monomorphizations) into identical compilation units. That unification only
# holds if EVERY crate in that invocation uses the SAME `codegen-units`
# setting — rustc partitions a crate's monomorphized code into N codegen
# units based on this value, so two crates compiling the "same" shared
# dependency with different `codegen-units` end up with differently-sized,
# differently-partitioned .rcgu.o objects despite sharing an identical
# crate/feature graph (confirmed empirically: perry-stdlib-static's `core`
# codegen unit was 551 KB vs an ext crate's 2.4 MB for the identically
# hash-named unit, before this fix). Without this, macOS's linker (which
# has no `-multiply_defined suppress` / `-ld_classic` tolerance mode
# anymore) hits thousands of `ld: duplicate symbol` errors once a program
# needs 2+ of these wrapper crates simultaneously, because perry's
# strip-dedup mechanism assumes same-named codegen units are byte-identical
# and safe to drop duplicates from — an assumption this mismatch violated.
[profile.release.package.perry-ext-http]
codegen-units = 1
[profile.release.package.perry-ext-ioredis]
codegen-units = 1
[profile.release.package.perry-ext-net]
codegen-units = 1
[profile.release.package.perry-ext-undici]
codegen-units = 1
[profile.release.package.perry-ext-ws]
codegen-units = 1

# Fast developer profile (#5422). Optimized enough for realistic local runs but
# without the distribution-grade settings that dominate compile time, so the
# edit/build loop stays short. Intended local loop:
#   cargo check -p perry                       # fastest correctness feedback
#   cargo build --profile perry-dev -p perry   # optimized local development
[profile.perry-dev]
inherits = "release"
lto = false
codegen-units = 1
incremental = true
strip = false
opt-level = 1

# Official distribution profile (#5422). The explicit, named home for the
# release-grade optimization Perry ships. Mirrors [profile.release] exactly —
# including every per-package override below — so official artifacts stay
# equivalent while being selected via `--profile dist`. Keep these blocks in
# sync with their [profile.release.*] counterparts above.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
# MUST match [profile.release] (#7302). `dist` is what release-packages.yml
# builds the SHIPPED libperry_{runtime,stdlib}.a with, and the exception
# transport requires the unwinder to step runtime Rust frames with
# longjmp-equivalent semantics. Under panic="unwind" rustc plants RFC-2945
# abort-on-unwind guards in every `extern "C"` helper that contains an
# interior Rust call, so a JS throw crossing such a helper — a throwing
# getter, a JSON.parse error, a throwing map callback — aborts the process
# instead of being caught. This line said "unwind" and so overrode the
# inherited value: it made the shipped runtime, and only the shipped
# runtime, fail that way. Paired with -C force-unwind-tables=yes from
# .cargo/config.toml; the runtime self-checks for the tables on the first
# `try` and aborts loudly if they are missing.
panic = "abort"
strip = true
opt-level = 3

[profile.dist.package.perry-runtime]
opt-level = 3
strip = false
[profile.dist.package.perry-ui-macos]
strip = false
codegen-units = 1
[profile.dist.package.perry-ui-gtk4]
strip = false
codegen-units = 1
[profile.dist.package.perry-ui-windows]
strip = false
codegen-units = 1
[profile.dist.package.perry-ui-windows-winui]
strip = false
codegen-units = 1
[profile.dist.package.perry-ui-geisterhand]
strip = false
codegen-units = 1
[profile.dist.package.perry-ui-ios]
strip = false
codegen-units = 1
[profile.dist.package.perry-ui-visionos]
strip = false
codegen-units = 1
[profile.dist.package.perry-ui-tvos]
strip = false
codegen-units = 1
[profile.dist.package.perry-ui-android]
strip = false
codegen-units = 1
[profile.dist.package.perry-ui-watchos]
strip = false
codegen-units = 1
[profile.dist.package.perry-stdlib]
opt-level = "s"
[profile.dist.package.perry-ext-events]
strip = false
codegen-units = 1
[profile.dist.package.perry-runtime-static]
strip = false
codegen-units = 1
[profile.dist.package.perry-stdlib-static]
strip = false
codegen-units = 1

# Issue #5928: mirrors the [profile.release.package.perry-ext-*] block above
# — see its comment for why matching `codegen-units` across every crate in
# the "shared tokio" (#507) cargo invocation is required.
[profile.dist.package.perry-ext-http]
codegen-units = 1
[profile.dist.package.perry-ext-ioredis]
codegen-units = 1
[profile.dist.package.perry-ext-net]
codegen-units = 1
[profile.dist.package.perry-ext-undici]
codegen-units = 1
[profile.dist.package.perry-ext-ws]
codegen-units = 1

[workspace.package]
version = "0.5.1644"
edition = "2021"
license = "MIT"
repository = "https://github.com/PerryTS/perry"

# Workspace-wide lint policy (members opt in via `[lints] workspace = true`).
# Deny-level lints are enforced by the `clippy` CI job: `cargo clippy` exits
# nonzero only on denies, so warn-level noise never blocks a PR. Ratchet new
# lints in here once the codebase is clean for them.
[workspace.lints.rust]
non_ascii_idents = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Deny-by-default in clippy, allowed here on purpose: Perry's runtime/stdlib/
# ext crates expose one big FFI surface called from Perry-generated native
# code — pub fns taking raw pointers with caller contracts ARE the calling
# convention (500+ sites), and `unsafe fn` is meaningless to those callers.
# Rust-facing helpers should still document SAFETY at the site.
not_unsafe_ptr_arg_deref = "allow"

[workspace.dependencies]
# SWC for TypeScript parsing
swc_ecma_parser = "32.0"
swc_ecma_ast = "19.0"
swc_ecma_visit = "19.0"
swc_common = "18.0"
swc_ecma_codegen = "21.0"
swc_bundler = "37.0"
swc_ecma_loader = "18.0"
swc_ecma_transforms_base = "32.0"
swc_ecma_transforms_react = "35.0"
swc_ecma_transforms_typescript = "35.0"

# Runtime dependencies
# bdwgc for garbage collection (Boehm GC)
# We'll use libgc-sys or similar

# Utilities
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Shared low-level deps — single source of truth for versions.
# Members inherit with `<dep>.workspace = true` (features stay additive
# per member). rand is deliberately absent: 0.8 vs 0.9 users coexist
# until the 0.9 API migration happens (follow-up).
libc = "0.2"
lazy_static = "1.5"
chrono = "0.4"
regex = "1.12"
aho-corasick = "1.1"
# The single regular-expression engine, through crates/perry-perex.
perex = "0.1.9"
# turnloop P0/P1: the per-agent event-loop wait driver and, since P1, Perry's
# stream sockets (docs/turnloop/p0-report.md, crates/perry-runtime/src/turnloop_net).
# 0.1.0-alpha.3 switched turnloop's own dependency requirements from exact pins
# to carets, which is what lifts the forced downgrades alpha.2 imposed on libc,
# tokio, redis and wasm-bindgen across this workspace. A caret here for the same
# reason; the exact version is pinned by Cargo.lock, locked once with the
# owner-approved one-time publish-age override. alpha.6 carries turnloop#89
# (ring slots allocated zeroed rather than written, which took Perry's idle RSS
# from +17.8 % to +2.9 % against the tokio arm and flipped two RSS rows to
# wins), #83 (multi-threaded accept / SO_REUSEPORT) and #85. Published
# 2026-09-17T13:24:47Z, sha256
# d04fa71225fc8a61ce9707bf1d5510ebe448a3ba00d71924f3aff8a2140e33a4 — the
# checksum Cargo.lock records, verified against the crates.io API rather than
# against the publishing workflow going green. The soak skill's rule holds:
# opting out is a committed, reviewable change and never a silent one, so the
# override lives here in the diff and the lock pins the exact artifact.
turnloop = "0.1.0-alpha.6"
# turnloop P5 (DESIGN §5b, §12 "P5"): the sans-I/O protocol crates that
# replace hyper's HTTP/1.1 parser and framer on Perry's server path, and
# `tokio_rustls` on every TLS path the loop owns. Default features only — the
# `turnloop` feature of these crates pulls `turnloop-io`'s `LocalExecutor`,
# which owns its OWN `Driver` and drops every completion whose token it did not
# issue; Perry already owns a `turnloop::Loop` and routes P1/P2/P3 tokens
# through it, so the codecs are driven sans-I/O over the P1 socket layer
# instead (docs/turnloop/p5-report.md, "Why sans-I/O").
turnloop-http = { version = "0.1.0-alpha.6", default-features = false }
turnloop-tls = { version = "0.1.0-alpha.6", default-features = false }
# turnloop WS lane: the sans-I/O WebSocket protocol + HTTP-upgrade helpers that
# replace tokio-tungstenite everywhere in the tree. Default features only --
# the `turnloop` feature pulls turnloop-io's LocalExecutor, which Perry cannot
# adopt for the same reason P5 recorded (it builds its own Driver and drops
# every completion it did not issue). See docs/turnloop/ws-report.md.
turnloop-websocket = { version = "0.1.0-alpha.6", default-features = false }
# turnloop P6 (DESIGN §12 "P6"): the sans-I/O SMTP client and MIME builder that
# replaces `lettre`'s tokio transport on the outbound mail path. Its `message`
# module re-exports the same `lettre` 0.11 builder Perry's nodemailer surface
# already uses, so only the transport changes
# (docs/turnloop/p6-report.md).
turnloop-smtp = { version = "0.1.0-alpha.6", default-features = false }
# turnloop P7 (docs/turnloop/p7-report.md): the sans-I/O database protocol
# cores that replace sqlx, the `redis` crate and the `mongodb` driver on the
# paths Perry's bindings own. Default features only, for the same reason as the
# two above — with the `turnloop` feature off these crates depend on neither
# `turnloop-io` nor `turnloop-tls`, so they are pure protocol state machines and
# Perry drives them over P1's socket layer. alpha.4 rather than alpha.3 because
# it is the release that gave MySQL and MongoDB one deflate state per
# connection, each compressed message framed as its own zlib stream; alpha.3
# re-created the state per message and is a wire-level regression to adopt.
turnloop-redis = { version = "0.1.0-alpha.6", default-features = false }
turnloop-mongodb = { version = "0.1.0-alpha.6", default-features = false }
hex = "0.4"
tempfile = "3"
itoa = "1.0"
ryu = "1.0"
once_cell = "1.19"
dashmap = "6.2"
bytes = "1.5"
semver = "1.0"
toml = "1.1"
stacker = "0.1.24"

# JWT — jsonwebtoken 10.x requires explicitly selecting a crypto backend
# (`rust_crypto` or `aws_lc_rs`) and opting into PEM parsing for
# `from_ec_pem` / `from_rsa_pem`. `rust_crypto` keeps the deps tree small
# relative to `aws_lc_rs`; users who need FIPS validation can fork.
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto", "use_pem"] }

# Terminal UI
indicatif = "0.18"
console = "0.16"
dialoguer = "0.12"

# File system
walkdir = "2.4"
notify = "6.1"

# HTTP / WebSocket (for publish command)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "blocking"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
hyper = "1.4"
hyper-util = "0.1"
http-body-util = "0.1"
# The `http` types crate. Already in the graph via hyper/reqwest/turnloop-http;
# named here so perry-stdlib can reach `StatusCode::canonical_reason` directly.
http = "1"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
socket2 = "0.6"
futures-util = "0.3"
url = "2"
dirs = "6"

# .env file loading (for publish command)
dotenvy = "0.15"

# Archive creation (for publish command)
flate2 = "1"
tar = "0.4"
base64 = "0.22"
# RFC 6455 §4.2.2's `Sec-WebSocket-Accept` digest. Already in the lockfile
# through perry-stdlib's optional `sha1`, so naming it here adds no package.
sha1 = "0.11"
zip = "8"
# zstd for transparent decompression of the npm-shipped `*.a.zst` archives.
# Statically vendored (no system libzstd dependency on the user's machine).
zstd = "0.13"

# Internal crates
perry-parser = { path = "crates/perry-parser" }
perry-api-manifest = { path = "crates/perry-api-manifest" }
perry-hir = { path = "crates/perry-hir" }
perry-transform = { path = "crates/perry-transform" }
perry-codegen = { path = "crates/perry-codegen" }
perry-dispatch = { path = "crates/perry-dispatch" }
# #1112: `perry-ffi` is published for external native wrappers. Its optional
# `runtime-link` edge supplies runtime symbols to in-tree adapter tests.
# The dependency-free registration core sits below both crates so future
# runtime wrappers can share identities without depending on perry-ffi.
# `default-features = false` so dependency EDGES (perry-stdlib, ext crates, the
# perry binary) don't force perry-runtime's heavy default features (`full`,
# `regex-engine`, `temporal`, `url-engine`, `string-normalize`, `intl-segmenter`)
# back on. The auto-optimize build selects perry-runtime with
# `--no-default-features` and re-adds only what a given program needs (see
# optimized_libs.rs), so an edge requesting defaults would defeat that (cargo
# unifies features additively). A plain `cargo build`/`cargo test --workspace`
# still builds perry-runtime as a *selected* package, so its own `default`
# applies — tests and the shipped prebuilt keep every engine. This mirrors why
# `wasm-host` must stay out of `default`, generalized to all heavy features.
perry-runtime = { path = "crates/perry-runtime", version = "0.5.1011", default-features = false }
perry-ffi = { path = "crates/perry-ffi", version = "0.5.1011" }
# turnloop P7 (docs/turnloop/p7-report.md): the loop-driven transport the four
# database bindings share. rlib only — it is linked *into* each binding's
# staticlib, never alongside it, so it exports no symbol of its own.
perry-db-turnloop = { path = "crates/perry-db-turnloop" }
# turnloop P11 (docs/turnloop/p11-report.md): the one copy of P6's outbound TLS
# client session — no socket, no loop, no I/O — shared by perry-stdlib's fetch
# and SMTP engines (which drive it from a completion sink) and by
# perry-http-client (which drives it from a blocking call on a loop it owns).
perry-tls-session = { path = "crates/perry-tls-session" }
# turnloop P12 (docs/turnloop/p12-report.md): the PUBLIC TLS client installer
# for a turnloop socket — the one thing P5 built for `perry-ext-net` and left
# `pub(crate)` there. ALPN goes in, the negotiated protocol and the RFC 5929
# `tls-server-end-point` channel binding come back out. rlib only: it is linked
# *into* each binding's staticlib, exactly like perry-db-turnloop.
perry-tls-turnloop = { path = "crates/perry-tls-turnloop" }
# turnloop P11: a blocking HTTP/1.1 + WebSocket client on a self-owned
# `turnloop::Loop`, for callers with NO JS event loop to cooperate with — the
# `perry` CLI, and the `perry-ext-*` HTTP bindings that already run on a
# blocking-pool thread. Nothing in perry-runtime or perry-stdlib depends on it
# and nothing should; see the crate docs for why an owned loop is correct here
# and nowhere else (PerryTS/turnloop#45).
perry-http-client = { path = "crates/perry-http-client" }
# turnloop: the HTTP/1.1 SERVER core, shared by every binding that serves
# HTTP and is not perry-ext-http (perry-ext-fastify, perry-stdlib's bundled
# framework server). See its lib.rs header for why the core moved down into a
# crate instead of those bindings taking an edge to perry-ext-http.
perry-http-server = { path = "crates/perry-http-server" }
perry-native-registration = { path = "crates/perry-native-registration", version = "0.5.1534" }
perry-ext-bcrypt = { path = "crates/perry-ext-bcrypt" }
perry-ext-argon2 = { path = "crates/perry-ext-argon2" }
perry-perex = { path = "crates/perry-perex" }
