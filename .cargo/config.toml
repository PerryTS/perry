# Supply-chain soak for cargo's own dependency resolution — the same
# soak-window rule the npm side applies via minimumReleaseAge /
# min-release-age: crate versions younger than the window are skipped by
# the resolver unless already in Cargo.lock. Cargo stabilized
# min-publish-age in Rust 1.100; this policy is now active without an
# `[unstable]` opt-in.
# Managed by scripts/soak/soak.mts (`npm run soak` / `npm run soak:fix`).
[registry]
global-min-publish-age = "7 days"

# Invoke-EH (#7302): the exception transport steps runtime Rust frames via
# the system unwinder, and panic=abort (profile.release) omits unwind tables
# by default — without this flag every throw crossing a helper frame is
# stranded. NOTE: a user-set RUSTFLAGS environment variable OVERRIDES this
# file entirely (cargo uses exactly one rustflags source) — carry the flag
# in your RUSTFLAGS too. The runtime self-checks on the first `try` and
# aborts loudly if the tables are missing (perry-runtime/src/eh.rs).
#
# `-Z use-sync-unwind=yes` asks for SYNCHRONOUS tables — exact at call sites
# only. That is every PC the transport ever unwinds from (throws, GC
# safepoints and `_Unwind_Backtrace` all start at a call; no signal handler
# throws). Asynchronous tables (the default for force-unwind-tables) also
# describe every epilogue instruction, which Apple's compact-unwind encoder
# cannot express, so ~90% of runtime functions fell back to a DWARF FDE:
# ~500 KB of `__eh_frame` in every macOS binary. Synchronous tables encode
# compactly and `eh_walker` decodes compact FRAME/FRAMELESS entries directly.
# Nightly-only, like the rest of this toolchain (rust-toolchain.toml).
[build]
rustflags = ["-C", "force-unwind-tables=yes", "-Z", "use-sync-unwind=yes"]

# No `force-frame-pointers`. #9486 once set it for x86_64 because
# `Error.stack` walked the `rbp` chain, which runtime Rust frames on
# x86_64-unknown-linux-gnu do not maintain (rustc keeps `rbp` a general
# callee-saved register there). It cost ~3% of runtime instructions on real
# programs (tsc +2.6%, Zod +3.4%). The capture now steps x86_64 Linux frames by
# their unwind tables (`perry-runtime/src/eh_walker_trace.rs`); the collector's
# x86_64 walk and the exception transport always did. Apple targets and
# AArch64 Linux keep frame records by rustc's own default, so their chain walk
# is unchanged. Do not reintroduce a `[target.*] rustflags` table without
# repeating the `[build]` flags in it: cargo uses the target list INSTEAD of
# the build list, and a runtime without unwind tables strands every throw.

# Android: real thread-locals. Rust's Android target spec has no
# `has-thread-local`, so std's `thread_local!` falls back to one pthread key
# per declaration, and bionic gives a process about 128 (shared with libc and
# ART). The runtime's raw `thread_local!`s (the cold allowlist in
# scripts/check_thread_locals.py) and its dependencies' exhausted them in a
# real program: std aborts in `LazyKey::lazy_init` the first time one more is
# touched (a Bloom app on a Pixel 4a, inside the collector). With
# `has-thread-local`, std (built from source below, so it takes the flag too)
# uses `#[thread_local]` statics in the emulated model rustc's Android target
# already selects: one emutls key for every thread-local in the process.
# `perry_thread_local!`'s Android pool (tls_os_pool.rs) is unaffected. The
# `[build]` flags are repeated, as above requires.
[target.aarch64-linux-android]
rustflags = ["-C", "force-unwind-tables=yes", "-Z", "use-sync-unwind=yes", "-Z", "has-thread-local=yes"]

[target.x86_64-linux-android]
rustflags = ["-C", "force-unwind-tables=yes", "-Z", "use-sync-unwind=yes", "-Z", "has-thread-local=yes"]

# std built from source without its optional backtrace support, for every
# cargo build of this workspace: release, dev, test, check/clippy, every
# target. std is compiled from the toolchain's rust-src (rust-toolchain.toml
# lists the component). rustup's prebuilt std is built with the features
# `backtrace`, `panic-unwind` and `compiler-builtins-c` (sysroot's only
# default is `panic-unwind`; std and std_detect have no default features in
# this toolchain, and std_detect reads the auxiliary vector with `getauxval`
# unconditionally on Linux). `build-std-features = []` drops exactly those
# three:
# - `backtrace`: std's default panic hook (`std::panicking::default_hook` ->
#   `std::sys::backtrace::_print_fmt`) links std's DWARF symbolizer (gimli,
#   addr2line, miniz_oxide, object, rustc-demangle) into every program perry
#   links: ~170 KB of .text no perry program runs. Without it a panic prints
#   its message and location as before; RUST_BACKTRACE has no effect and
#   `Backtrace::capture()` returns raw frames without symbols.
# - `panic-unwind`: every build is panic=abort; build-std builds
#   `panic_abort` only.
# - `compiler-builtins-c`: compiler-rt's C intrinsics; rust-src does not ship
#   the compiler-rt sources, so it cannot be built here. compiler_builtins'
#   Rust intrinsics stay; the one the prebuilt archive bundled from C and
#   this std does not define, `__popcountdi2`, comes from the platform's
#   compiler runtime at link time (libgcc on Linux x86-64).
# std's `unwind` crate (the `_Unwind_*` the JS exception transport walks
# with) is not a feature and stays. The CI gate scripts/check_std_symbolizer.sh
# fails on any std symbolizer symbol in the runtime archives or a linked
# program.
#
# Host builds need no `--target`: this cargo builds std for the host when the
# target is implicit, so artifacts stay in target/<profile>/.
#
# Tests build with the same panic strategy as everything else
# (`panic-abort-tests`). Otherwise cargo builds a second, unwinding std for
# the test graph next to the profile's panic=abort std (#7302), and
# build-std's one panic_abort unit fails the abort std ("the crate
# `panic_abort` does not have the panic strategy `abort`"). Under panic=abort
# libtest runs each test in its own process, so `#[should_panic]` works;
# `catch_unwind` catches nothing, as in every shipped build.
[unstable]
build-std = ["std", "panic_abort"]
build-std-features = []
panic-abort-tests = true

# The bundled SQLite is built as node's is in this one respect: node compiles
# it with SQLITE_DEFAULT_MEMSTATUS=0 (`PRAGMA compile_options` on node 26),
# so every sqlite3_malloc skips the global memory-statistics mutex and
# counters. Nothing in perry reads SQLite's memory statistics.
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"
# Reproducible C archives: mimalloc (options.c) embeds __DATE__/__TIME__, and
# gcc/clang take both from SOURCE_DATE_EPOCH. A build time in the runtime
# archive moves linked strings: one ending in "1" let lld tail-merge another
# literal into it, every later string moved by 2 bytes, and startup Ir A/Bs
# saw a +12 Ir from_utf8 delta between two equal programs.
SOURCE_DATE_EPOCH = "0"
# mimalloc's libc calls through the GOT on x86_64 glibc Linux: every C unit
# of that target force-includes crates/perry-runtime/c-force-include/
# perry_noplt_libc.h, which acts only in mimalloc's unity TU (see the header).
# Without it, lld (the default Linux linker, `link/elf_linker.rs`) gives
# each libc function mimalloc calls a second, lazily bound PLT slot. A
# CFLAGS_x86_64_unknown_linux_gnu set in the environment wins over this one
# (no shim: lld then costs ~6K ld.so instructions per run); a CPATH set in
# the environment must name that directory too.
# One token (`-include<file>`, which gcc and clang accept): C builds that parse
# CFLAGS themselves (openssl-src's Configure) read `-include <file>` as two
# arguments and take the file for a second target.
CFLAGS_x86_64_unknown_linux_gnu = "-includeperry_noplt_libc.h"
CPATH = { value = "crates/perry-runtime/c-force-include", relative = true }

# The compiler and every archive it links, in one Cargo graph (the workspace
# `default-members` minus perry-container-compose): `cargo build-perry
# --release [-p <more>]`. CI and recipes that add packages to the build use
# this so the runtime, stdlib and wrapper archives stay one graph (#7358).
[alias]
build-perry = [
    "build",
    "-p", "perry",
    "-p", "perry-runtime-static",
    "-p", "perry-stdlib-static",
    "-p", "perry-wasm-host",
    "-p", "perry-ext-ads",
    "-p", "perry-ext-argon2",
    "-p", "perry-ext-bcrypt",
    "-p", "perry-ext-better-sqlite3",
    "-p", "perry-ext-http",
    "-p", "perry-ext-net",
    "-p", "perry-ext-parcel-watcher",
    "-p", "perry-ext-pdf",
    "-p", "perry-ext-sharp",
    "-p", "perry-ext-bun",
    "-p", "perry-ext-ws",
    "-p", "perry-ext-zlib",
]

# The instrumented prebuilt variant (`scripts/build_instr_runtime.sh`): the
# archives of `build-perry` (not the compiler, not the WebAssembly host) built
# with `PERRY_RUNTIME_INSTRUMENTS=1` into their own target dir, so each one
# bundles an instrumented runtime from one graph.
build-perry-instr = [
    "build",
    "-p", "perry-runtime-static",
    "-p", "perry-stdlib-static",
    "-p", "perry-ext-ads",
    "-p", "perry-ext-argon2",
    "-p", "perry-ext-bcrypt",
    "-p", "perry-ext-better-sqlite3",
    "-p", "perry-ext-http",
    "-p", "perry-ext-net",
    "-p", "perry-ext-parcel-watcher",
    "-p", "perry-ext-pdf",
    "-p", "perry-ext-sharp",
    "-p", "perry-ext-bun",
    "-p", "perry-ext-ws",
    "-p", "perry-ext-zlib",
]
