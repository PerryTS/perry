name: Perry Mr Boxington cache
description: Configure Perry's pinned mbx version and shared release object cache
inputs:
  cache-generation:
    description: Cache generation; bump to invalidate Perry's cache series
    required: true
  save-on-workflow-dispatch:
    description: Allow trusted manual workflow runs to save cache entries
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # mbx publishes no x86_64-apple-darwin release binary (no release has ever
    # shipped one), so the pinned-release installer cannot verify one on the
    # Intel runners. Build the same pinned version from crates.io instead;
    # --locked + the registry checksum verify the source, and the installed
    # version is asserted. The action then picks mbx up from PATH. Install
    # outside ~/.cargo/bin: rust-cache's post step cleans that directory
    # before this action's own post step runs mbx.
    - name: Build mbx 1.28.0 from crates.io (Intel macOS)
      if: runner.os == 'macOS' && runner.arch == 'X64'
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/perry-mbx"
        cargo install --locked --version 1.28.0 --root "$root" mbx
        echo "$root/bin" >> "$GITHUB_PATH"
        installed=$("$root/bin/mbx" --version)
        case "$installed" in
          *" 1.28.0"*|"1.28.0") ;;
          *) echo "::error::expected mbx 1.28.0, got: $installed"; exit 1 ;;
        esac
    - name: Configure Mr Boxington (Intel macOS, mbx from PATH)
      if: runner.os == 'macOS' && runner.arch == 'X64'
      uses: ./.github/actions/perry/jdx/mr-boxington-action
      with:
        github-cache-mode: objects
        cache-generation: ${{ inputs.cache-generation }}
        save-on-workflow-dispatch: ${{ inputs.save-on-workflow-dispatch }}
    - name: Configure Mr Boxington
      if: runner.os != 'macOS' || runner.arch != 'X64'
      uses: ./.github/actions/perry/jdx/mr-boxington-action
      with:
        version: "1.28.0"
        github-cache-mode: objects
        cache-generation: ${{ inputs.cache-generation }}
        save-on-workflow-dispatch: ${{ inputs.save-on-workflow-dispatch }}
