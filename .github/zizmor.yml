  excessive-permissions:
    ignore:
      # Workflow-level contents:write + actions:write predate this gate;
      # splitting them across the 13 release jobs is a release-pipeline
      # change that needs its own carefully-tested PR (a mistake only
      # manifests at the next tag). Tracked as follow-up.
      - release-packages.yml
