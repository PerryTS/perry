name: Compatibility
run-name: ${{ format('Compatibility / {0} / {1}', inputs.suite || 'scheduled', github.ref_name) }}
on:
  pull_request:
    types:
      - labeled
      - opened
      - reopened
      - synchronize
    paths:
      - .cargo/**
      - .github/actions/setup-llvm22/**
      - .github/workflows/compatibility.yml
      - .github/workflows/feature-matrix.yml
      - .github/workflows/node-compat-matrix.yml
      - .github/workflows/node-core-subset.yml
      - .github/workflows/node-suite-guard.yml
      - .github/workflows/npm-package-sweep.yml
      - .github/workflows/wasi-check.yml
      - Cargo.lock
      - Cargo.toml
      - crates/perry-codegen/Cargo.toml
      - crates/perry-codegen/src/**
      - crates/perry-dispatch/**
      - crates/perry-ext-*/**
      - crates/perry-runtime/**
      - crates/perry-stdlib/**
      - crates/perry/**
      - crates/perry/src/commands/compile/**
      - rust-toolchain.toml
      - scripts/actions_catalog.json
      - scripts/actions_plan.py
      - scripts/runtime_abi_check.py
      - scripts/wasi_build_runtime.sh
      - scripts/wasi_check.sh
      - scripts/wasi_ir_check.sh
      - scripts/wasi_smoke.sh
      - scripts/wasi_smoke/**
      - scripts/wasi_toolchain.sh
      - test-files/test_gap_*.ts
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: 17 3 * * *
    - cron: 25 5 * * *
    - cron: 37 4 * * *
    - cron: 41 2 * * *
    - cron: 43 4 * * *
    - cron: 57 4 * * *
  workflow_dispatch:
    inputs:
      suite:
        description: Compatibility suite or all suites.
        type: choice
        options:
          - all
          - node-compat-matrix
          - node-suite-guard
          - node-core-subset
          - feature-matrix
          - wasi-check
          - npm-package-sweep
        default: all
      apis:
        description: Optional Node core API list.
        type: string
        default: ''
      max_per_api:
        description: Node core test limit per API; 0 means unlimited.
        type: string
        default: 25
      packages:
        description: Optional comma-separated package specs.
        type: string
        default: ''
      limit:
        description: Package sweep limit; 0 means all selected packages.
        type: number
        default: 6
      strict:
        description: Fail on any package sweep failure.
        type: boolean
        default: false
permissions: {}
concurrency:
  group: compatibility-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.route.outputs.plan }}
      selection: ${{ steps.route.outputs.selection }}
      module_inputs: ${{ steps.route.outputs.module_inputs }}
    steps:
      - name: Checkout workflow source for routing
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth 1 origin "$CHECKOUT_REF"
          git checkout --force --detach FETCH_HEAD
      - name: Route suites
        id: route
        env:
          SUITE: ${{ inputs.suite }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--category compatibility --event "$EVENT_NAME" --event-path "$EVENT_PATH" --ref "$REF")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/ci_pr_files.py "$GITHUB_REPOSITORY" "$PR_NUMBER" --expected-head "$PR_HEAD_SHA" > changed-files.txt
            args+=(--changed-files changed-files.txt)
          fi
          args+=(--suite "${SUITE:-}")
          python3 scripts/actions_plan.py "${args[@]}"
          pull_request\" ]]; then\n  python3 scripts/ci_pr_files.py \"$GITHUB_REPOSITORY\"\
          \ \"$PR_NUMBER\" --expected-head \"$PR_HEAD_SHA\" > changed-files.txt\n  args+=(--changed-files\
          \ changed-files.txt)\nfi\nargs+=(--suite \"${SUITE:-}\")\npython3 scripts/actions_plan.py\
          \ \"${args[@]}\"\n"
  node-compat-matrix__node-compat-matrix:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22
      - name: Start sccache
        uses: ./.github/actions/perry/mozilla-actions/sccache-action
      - uses: ./.github/actions/perry/Swatinem/rust-cache
        with:
          shared-key: "${{ runner.os }}-perry"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Node.js (executes the runner; oracle is the pinned dist)
        uses: ./.github/actions/perry/actions/setup-node
        with:
          node-version-file: .node-version
      - name: Build Perry release binary
        run: cargo build --release -p perry -p perry-runtime -p perry-stdlib -p perry-runtime-static -p perry-stdlib-static
      - name: Node builtin compat matrix guard (--check, pinned oracle)
        run: |
          set -euo pipefail
          echo '### Node builtin compat matrix guard' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/node_compat_matrix.mjs --check \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
    needs:
      - route
    if: ${{ needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['node-compat-matrix'] }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "2G"
      CARGO_INCREMENTAL: "0"

    permissions:
      contents: read
      pull-requests: read
    name: Node Compat Matrix Guard
  node-compat-matrix:
    name: Node Compat Matrix Guard / suite result
    needs:
      - route
      - node-compat-matrix__node-compat-matrix
    if: ${{ always() && (needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['node-compat-matrix']) }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHILD_JOB_IDS: '["node-compat-matrix__node-compat-matrix"]'
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check suite jobs
        shell: bash
        run: |-
          python3 - <<'PY'
          import json, os, sys
          ids = json.loads(os.environ['CHILD_JOB_IDS'])
          results = json.loads(os.environ['JOB_RESULTS'])
          bad = {job: results.get(job, {}).get('result', 'missing') for job in ids
                 if results.get(job, {}).get('result') not in {'success', 'skipped'}}
          if bad:
              print('Suite job failures:', json.dumps(bad, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          print(f'{len(ids)} suite jobs completed or were intentionally skipped')
          PY
  node-suite-guard__node-suite-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22
      - name: Start sccache
        uses: ./.github/actions/perry/mozilla-actions/sccache-action
      - uses: ./.github/actions/perry/Swatinem/rust-cache
        with:
          shared-key: "${{ runner.os }}-perry"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Node.js
        uses: ./.github/actions/perry/actions/setup-node
        with:
          node-version-file: .node-version
      - name: Build Perry release binary
        run: cargo build --release -p perry -p perry-runtime -p perry-stdlib -p perry-runtime-static -p perry-stdlib-static
      - name: Node-suite regression guard (floor baseline, node 26)
        run: |
          set -euo pipefail
          echo '### Node-suite regression guard (node 26)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/node_suite_regression_check.py target/release/perry . \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
    needs:
      - route
    if: ${{ needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['node-suite-guard'] }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "2G"
      CARGO_INCREMENTAL: "0"

    permissions:
      contents: read
      pull-requests: read
    name: Node Suite Regression Guard
  node-suite-guard:
    name: Node Suite Regression Guard / suite result
    needs:
      - route
      - node-suite-guard__node-suite-guard
    if: ${{ always() && (needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['node-suite-guard']) }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHILD_JOB_IDS: '["node-suite-guard__node-suite-guard"]'
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check suite jobs
        shell: bash
        run: |-
          python3 - <<'PY'
          import json, os, sys
          ids = json.loads(os.environ['CHILD_JOB_IDS'])
          results = json.loads(os.environ['JOB_RESULTS'])
          bad = {job: results.get(job, {}).get('result', 'missing') for job in ids
                 if results.get(job, {}).get('result') not in {'success', 'skipped'}}
          if bad:
              print('Suite job failures:', json.dumps(bad, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          print(f'{len(ids)} suite jobs completed or were intentionally skipped')
          PY
  node-core-subset__radar:
    name: Node Core Subset Radar / radar (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    env:
  # Number of shards. MUST equal the length of `matrix.shard` below — the merge
  # job uses it to know which per-shard reports to expect, so that a shard whose
  # runner died outright is detected as missing rather than silently dropped.
      NODE_CORE_SHARDS: "6"
  # Bail out of the sweep with a partial-but-flagged report at this many seconds
  # rather than running until something else kills us. Sized to sit well inside
  # the job's `timeout-minutes` even after the release build and a cold ext-crate
  # prewarm (the budget covers the prewarm too).
      NODE_CORE_TIME_BUDGET: "2400"

      NODE_CORE_APIS: ${{ github.event_name == 'workflow_dispatch' && fromJSON(needs.route.outputs.module_inputs)['node-core-subset'].apis || '' }}
      NODE_CORE_MAX_PER_API: ${{ github.event_name == 'workflow_dispatch' && fromJSON(needs.route.outputs.module_inputs)['node-core-subset'].max_per_api || '25' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "true"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22
      - uses: ./.github/actions/perry/Swatinem/rust-cache
        with:
          shared-key: "${{ runner.os }}-perry"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Resolve Node version from the pinned test-corpus ref
        id: node_core_version
        run: |
          set -euo pipefail
          # pinned-version.txt holds a git branch name, e.g. "v22.x".
          node_ref="$(tr -d '[:space:]' < test-compat/node-core/pinned-version.txt)"
          node_version="${node_ref#v}"          # v22.x -> 22.x
          echo "Pinned Node core corpus: $node_ref -> node-version $node_version"
          echo "version=$node_version" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js (matches the pinned test corpus, NOT .node-version)
        uses: ./.github/actions/perry/actions/setup-node
        with:
          node-version: ${{ steps.node_core_version.outputs.version }}
      - name: Sparse checkout pinned Node.js tests
        run: |
          set -euo pipefail
          node_ref="$(cat test-compat/node-core/pinned-version.txt)"
          git clone --no-checkout --depth 1 --branch "$node_ref" \
            --filter=blob:none https://github.com/nodejs/node vendor/nodejs
          git -C vendor/nodejs sparse-checkout set test/parallel test/common test/fixtures
          git -C vendor/nodejs checkout
      - name: Build Perry release binary
        run: cargo build --release -p perry -p perry-runtime -p perry-stdlib -p perry-runtime-static -p perry-stdlib-static
      - name: Run Node core subset radar
        run: |
          set -euo pipefail
          args=(
            --root vendor/nodejs
            --report "test-compat/node-core/report-shard-${{ matrix.shard }}.json"
            --max-per-api "$NODE_CORE_MAX_PER_API"
            --shard "${{ matrix.shard }}/${{ strategy.job-total }}"
            --time-budget "$NODE_CORE_TIME_BUDGET"
          )
          if [[ -n "$NODE_CORE_APIS" ]]; then
            read -r -a requested_apis <<< "$NODE_CORE_APIS"
            args+=(--api "${requested_apis[@]}")
          fi
          scripts/node_core_subset.py "${args[@]}"
      - name: Runner headroom
        if: always()
        run: |
          # The nightly's terminal symptom was the VM being reclaimed mid-sweep.
          # If that recurs, this is the evidence we did not have (#6305).
          df -h / | tail -1
          free -h | head -2
      - name: Upload shard report
        if: always()
        uses: ./.github/actions/perry/actions/upload-artifact
        with:
          name: node-core-subset-report-shard-${{ matrix.shard }}
          path: test-compat/node-core/report-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
    needs:
      - route
    if: ${{ needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['node-core-subset'] }}
    permissions:
      contents: read
      pull-requests: read
  node-core-subset__report:
    name: Node Core Subset Radar / merge + publish
    needs:
      - route
      - node-core-subset__radar
    if: ${{ needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['node-core-subset'] && (always()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "true"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Download shard reports
        uses: ./.github/actions/perry/actions/download-artifact
        with:
          pattern: node-core-subset-report-shard-*
          merge-multiple: true
          path: shard-reports
      - name: Merge shard reports
        run: |
          set -euo pipefail
          # Ask for every shard report BY NAME rather than globbing whatever
          # turned up: a shard whose runner was reclaimed uploads nothing, and
          # that has to read as a missing shard, not as a smaller sweep. The
          # merge exits non-zero if any shard is missing or incomplete — but it
          # writes the aggregate report first, so the number still lands.
          reports=()
          for i in $(seq 1 "$NODE_CORE_SHARDS"); do
            reports+=("shard-reports/report-shard-${i}.json")
          done
          scripts/node_core_subset.py \
            --merge "${reports[@]}" \
            --report test-compat/node-core/report.json
      - name: Write radar summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report_path = Path("test-compat/node-core/report.json")
          print("## Node Core Subset Radar")
          print("")
          if not report_path.exists():
              print("No report was generated.")
              raise SystemExit(0)

          report = json.loads(report_path.read_text())
          if not report.get("complete", False):
              print("> [!WARNING]")
              print("> **The sweep did not complete** — the parity below is a "
                    "LOWER BOUND over the tests that actually ran.")
              for key, label in (("missing_shard_reports", "Missing shard reports"),
                                 ("unreached_apis", "Never reached"),
                                 ("partial_apis", "Cut off mid-API")):
                  if report.get(key):
                      print(f"> - {label}: `{', '.join(report[key])}`")
              print("")

          print(f"Node corpus: `{report.get('node_pinned', '')}`")
          print(f"Node runtime: `{report.get('node_runtime', '')}`")
          print(f"Parity: `{report.get('parity_pct', 0)}%` over `{report.get('judged', 0)}` judged tests")
          print("")
          print("| api | pass | diff | runtime-fail | compile-fail | node-skip |")
          print("| --- | ---: | ---: | ---: | ---: | ---: |")
          for api, counts in sorted(report.get("per_api", {}).items()):
              print(
                  f"| {api} | {counts.get('pass', 0)} | {counts.get('diff', 0)} | "
                  f"{counts.get('runtime-fail', 0)} | {counts.get('compile-fail', 0)} | "
                  f"{counts.get('node-skip', 0)} |"
              )
          PY
      - name: Upload radar report
        if: always()
        uses: ./.github/actions/perry/actions/upload-artifact
        with:
          name: node-core-subset-report
          path: test-compat/node-core/report.json
          if-no-files-found: warn
    env:
  # Number of shards. MUST equal the length of `matrix.shard` below — the merge
  # job uses it to know which per-shard reports to expect, so that a shard whose
  # runner died outright is detected as missing rather than silently dropped.
      NODE_CORE_SHARDS: "6"
  # Bail out of the sweep with a partial-but-flagged report at this many seconds
  # rather than running until something else kills us. Sized to sit well inside
  # the job's `timeout-minutes` even after the release build and a cold ext-crate
  # prewarm (the budget covers the prewarm too).
      NODE_CORE_TIME_BUDGET: "2400"

    permissions:
      contents: read
      pull-requests: read
  node-core-subset:
    name: Node Core Subset Radar / suite result
    needs:
      - route
      - node-core-subset__radar
      - node-core-subset__report
    if: ${{ always() && (needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['node-core-subset']) }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHILD_JOB_IDS: '["node-core-subset__radar","node-core-subset__report"]'
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check suite jobs
        shell: bash
        run: |-
          python3 - <<'PY'
          import json, os, sys
          ids = json.loads(os.environ['CHILD_JOB_IDS'])
          results = json.loads(os.environ['JOB_RESULTS'])
          bad = {job: results.get(job, {}).get('result', 'missing') for job in ids
                 if results.get(job, {}).get('result') not in {'success', 'skipped'}}
          if bad:
              print('Suite job failures:', json.dumps(bad, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          print(f'{len(ids)} suite jobs completed or were intentionally skipped')
          PY
  feature-matrix__feature-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "true"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
