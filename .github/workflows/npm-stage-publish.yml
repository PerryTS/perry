name: npm stage publish

# Perry's OIDC staged-upload workflow, modeled on a tiered registry-infra design
# adapted to Perry's multi-platform-binary reality.
#
# ORDER RULE: this workflow only STAGES — nothing is public, and NO git tag or
# GitHub release exists yet. The tag + immutable GH release are cut LAST, by
# the local `npm run publish:approve` (scripts/publish/pipeline.mts), only
# after the approved version is live on npm.
#
# The 9 @perryts/* packages are platform binaries + static libs built on
# platform runners, so the stage upload MUST follow the per-platform build
# legs. Rather than duplicate the build matrix (which would drift from
# release-packages.yml), this workflow dispatches release-packages.yml in its
# existing `stage` mode (build-only, archives as workflow artifacts, nothing
# publishes) and then a single `stage-upload` job downloads those artifacts,
# runs scripts/stage-npm.sh, and `npm stage publish`es each package under
# OIDC trusted publishing.
#
# Auth: OIDC trusted publishing only — id-token: write, NO long-lived NPM_TOKEN.
# Each @perryts/* package must list this workflow + the `npm-publish` environment
# as its one trusted publisher on npmjs.com, with the `npm stage publish`
# action explicitly allowed (see docs/src/contributing/releasing.md).
# The auth-posture gate in
# scripts/publish/auth-posture.mts refuses any long-lived token present here.
#
# Guardrails: dispatches for the same dist-tag are serialized (concurrency:
# below); a caller-supplied build-run-id is verified (workflow identity,
# success, exact commit) before its artifacts are trusted; and the stage
# step is idempotent — it skips packages a prior partial run already staged
# instead of re-attempting all 9.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Stage for real (false = dry-run, the default).'
        type: boolean
        default: false
      dist-tag:
        description: 'npm dist-tag to stage under.'
        type: string
        default: 'latest'
      build-run-id:
        description: 'Reuse an existing release-packages.yml stage-mode build run instead of dispatching a new one.'
        type: string
        default: ''
      candidate-sha:
        description: 'Expected release-candidate commit. Required when publish=true; protects a branch-tip race.'
        type: string
        default: ''

permissions:
  contents: read

# Serialize staged publishes for the same dist-tag — two concurrent dispatches
# could otherwise both pass resolve-build's run-matching and both attempt
# `npm stage publish` for the same version. `cancel-in-progress: false` so a
# real staged publish already in flight is never cancelled out from under it.
concurrency:
  group: npm-stage-publish-${{ inputs.dist-tag }}
  cancel-in-progress: false

jobs:
  # A real registry stage is a release operation even though it is not public
  # yet. Require the same exact-SHA gates as the release workflow before
  # spending the cross-platform build or writing staged registry entries.
  release-gates:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require full Tests + Simulator Tests on this commit
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.candidate-sha }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error::candidate-sha is required for a real staged publish. Use the local npm run publish:stage command." >&2
            exit 1
          fi
          if [ "$SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Candidate branch moved: workflow is on $SHA, but the dispatcher pinned $EXPECTED_SHA." >&2
            exit 1
          fi
          tests=$(gh api "/repos/$REPO/actions/workflows/test.yml/runs?head_sha=$SHA&per_page=20")
          full_run=""
          for run_id in $(echo "$tests" | jq -r '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id'); do
            if gh api "/repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
                 --jq '.jobs[] | select(.name == "full-suite-gate" and .conclusion == "success") | .name' \
                 | grep -q full-suite-gate; then
              full_run="$run_id"
              break
            fi
          done
          if [ -z "$full_run" ]; then
            echo "::error::No successful full-tier test.yml run (full-suite-gate) exists on $SHA. Dispatch test.yml with tier=full first." >&2
            exit 1
          fi
          sim_run=$(gh api "/repos/$REPO/actions/workflows/simctl-tests.yml/runs?head_sha=$SHA&per_page=20" \
            --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id' \
            | head -1)
          if [ -z "$sim_run" ]; then
            echo "::error::No successful simctl-tests.yml run exists on $SHA. Dispatch it first." >&2
            exit 1
          fi
          echo "Release gates passed on $SHA: test run $full_run, simulator run $sim_run."

  # Resolve the build run to stage from: either a caller-supplied build-run-id
  # (re-use), or dispatch release-packages.yml in stage mode and capture its
  # run id. The build matrix itself lives in release-packages.yml — single
  # source of truth, no drift.
  resolve-build:
    needs: release-gates
    runs-on: ubuntu-latest
    permissions:
      actions: write   # dispatch release-packages.yml (stage mode) + watch it
      contents: read
    outputs:
      build-run-id: ${{ steps.resolve.outputs.build-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve or dispatch the stage-mode build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXISTING: ${{ inputs.build-run-id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The commit THIS workflow run is dispatching from — every downstream
          # check (reused-run headSha match, or the fresh dispatch's --ref and
          # run-selection below) pins to this, never to "whatever the default
          # branch happens to be at the moment we call gh".
          CUR_SHA=$(git rev-parse HEAD)
          if [ -n "$EXISTING" ]; then
            RUN_ID="$EXISTING"
            # Validate the reused run before trusting its artifacts: it must
            # actually be a release-packages.yml run, it must have succeeded,
            # and it must have built the commit we're dispatching from — a
            # stale or wrong-workflow run-id would otherwise stage old/wrong
            # binaries under today's version and dist-tag with no error.
            RUN_JSON=$(gh run view "$RUN_ID" -R "$REPO" --json workflowName,conclusion,status,headSha)
            RUN_WORKFLOW=$(echo "$RUN_JSON" | jq -r '.workflowName')
            RUN_STATUS=$(echo "$RUN_JSON" | jq -r '.status')
            RUN_CONCLUSION=$(echo "$RUN_JSON" | jq -r '.conclusion')
            RUN_SHA=$(echo "$RUN_JSON" | jq -r '.headSha')
            if [ "$RUN_WORKFLOW" != "Release Packages" ]; then
              echo "::error::build-run-id $RUN_ID is a '$RUN_WORKFLOW' run, not Release Packages — refusing to stage its artifacts." >&2
              exit 1
            fi
            if [ "$RUN_STATUS" != "completed" ] || [ "$RUN_CONCLUSION" != "success" ]; then
              echo "::error::build-run-id $RUN_ID is status=$RUN_STATUS conclusion=$RUN_CONCLUSION, not a successful completed run." >&2
              exit 1
            fi
            if [ "$RUN_SHA" != "$CUR_SHA" ]; then
              echo "::error::build-run-id $RUN_ID built $RUN_SHA, but this dispatch is at $CUR_SHA — refusing to stage a build of a different commit." >&2
              exit 1
            fi
            echo "Reusing build run $RUN_ID (verified: Release Packages, success, sha $RUN_SHA)."
          else
            # Dispatch release-packages.yml in stage mode on our named branch,
            # after proving that its remote tip is OUR exact commit. Without
            # this, `gh workflow run` dispatches
            # against the repo's default branch tip at call time — which can
            # differ from the commit this npm-stage-publish.yml run itself
            # checked out (a different ref triggered it, or main advanced in
            # the gap between the two dispatches) — and would build/stage the
            # wrong commit's binaries under today's version. Stage mode is the
            # DEFAULT workflow_dispatch (no inputs = build-only smoke run; the
            # preflight job's else-branch sets MODE=stage), so no other input
            # is needed.
            DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            TIP_SHA=$(gh api "/repos/$REPO/git/ref/heads/$REF_NAME" --jq '.object.sha')
            if [ "$TIP_SHA" != "$CUR_SHA" ]; then
              echo "::error::$REF_NAME moved to $TIP_SHA, but this staging run is on $CUR_SHA — re-dispatch from a pinned candidate branch." >&2
              exit 1
            fi
            gh workflow run release-packages.yml -R "$REPO" --ref "$REF_NAME"
            # Poll for the workflow_dispatch run we just created. Match by
            # event + createdAt AFTER the dispatch timestamp AND headSha ==
            # our commit — createdAt alone could still match a concurrent
            # dispatch of the SAME workflow from a different ref that happened
            # to land in the same window, which would stage the wrong commit.
            sleep 5
            RUN_ID=""
            for _attempt in $(seq 1 20); do
              RUN_ID=$(gh run list --workflow release-packages.yml -R "$REPO" \
                --event workflow_dispatch --limit 5 \
                --json databaseId,createdAt,headSha \
                --jq "[.[] | select(.createdAt >= \"$DISPATCHED_AT\" and .headSha == \"$CUR_SHA\")][0].databaseId" 2>/dev/null || true)
              if [ -n "$RUN_ID" ]; then break; fi
              sleep 3
            done
            if [ -z "$RUN_ID" ]; then
              echo "::error::could not resolve a release-packages.yml run id (dispatched at $CUR_SHA) after dispatch." >&2
              exit 1
            fi
            echo "Dispatched release-packages.yml stage build: run $RUN_ID (sha $CUR_SHA)."
          fi
          echo "build-run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Await the stage-mode build
        # The build MUST finish before stage-upload can download its artifacts
        # — actions/download-artifact from an in-progress run gets nothing.
        # gh run watch returns immediately for an already-completed run, so
        # this is safe for the reuse-existing-run-id path too.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.resolve.outputs.build-run-id }}"
          echo "Watching release-packages.yml run $RUN_ID to completion…"
          gh run watch "$RUN_ID" -R "$REPO" --exit-status
          echo "Build run $RUN_ID succeeded — ready to download artifacts."

  # The OIDC stage upload. Downloads the build artifacts from the resolved
  # run, stages the npm packages, and `npm stage publish`es each under OIDC.
  stage-upload:
    needs: resolve-build
    runs-on: ubuntu-latest
    environment: npm-publish   # npm's trusted-publisher config pins this env name
    permissions:
      actions: read     # download artifacts from the resolved stage-mode build run
      contents: read
      id-token: write   # npm provenance / trusted publishing mints the OIDC token here
    env:
      DIST_TAG: ${{ inputs.dist-tag }}
      BUILD_RUN_ID: ${{ needs.resolve-build.outputs.build-run-id }}
      PUBLISH: ${{ inputs.publish }}
      SOCKET_API_TOKEN: ${{ secrets.SOCKET_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # DELIBERATE EXEMPTION from the repo-wide .node-version pin: this Node is
      # a publishing toolchain (npm registry auth), not a test oracle.
      # Registered in scripts/check_node_version_consistency.py.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm + assert the publish-flow floor
        # The floor is npm >= 11.17: it is the newest of the features this job
        # needs — `npm stage` (staged publishing, >= 11.15.0), OIDC trusted
        # publishing (>= 11.5.1), and `min-release-age` in DAYS (>= 11.17).
        # npm@latest satisfies it; the assert is a fail-fast guard if the
        # runner image or a future pin ever drops below.
        run: |
          npm install -g npm@latest
          floor=11.17.0
          cur=$(npm --version | tr -d 'v')
          if [ "$(printf '%s\n%s\n' "$floor" "$cur" | sort -V | head -n1)" != "$floor" ]; then
            echo "::error::npm $cur is below the publish-flow floor of $floor (staged publishing + OIDC + min-release-age)." >&2
            exit 1
          fi
          echo "npm $cur satisfies the publish-flow floor (>= $floor)."

      - name: Download build artifacts from the stage-mode build run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-build.outputs.build-run-id }}

      - name: Stage npm packages
        run: ./scripts/stage-npm.sh release-artifacts/

      - name: Sanity-check staged packages
        run: |
          for dir in npm/perry npm/perry-*; do
            if [ ! -f "$dir/package.json" ]; then
              echo "::error::MISSING package.json in $dir" >&2
              exit 1
            fi
            node -e "const p=require('./$dir/package.json'); console.log(p.name, p.version)"
          done

      - name: npm stage publish (OIDC, platforms first, wrapper last)
        # Stages ONLY — nothing is public until the local `publish:approve` runs
        # `npm stage approve` with 2FA. Skip versions already staged/published
        # so the job is idempotent. One platform's failure must not starve the
        # packages after it — record failures, keep going, fail at the end.
        # NO NPM_TOKEN secret is set — OIDC trusted publishing mints the token
        # from id-token: write (setup-node registry-url + the npm-publish env).
        run: |
          set -e
          if [ "$PUBLISH" != "true" ]; then
            echo "PUBLISH=false (dry-run) — running stage-npm only, no registry writes."
            exit 0
          fi
          # Refuse any long-lived token (the auth-posture gate, in shell form).
          for v in NPM_TOKEN NODE_AUTH_TOKEN NPM_AUTH_TOKEN; do
            if [ -n "$(printenv $v 2>/dev/null || true)" ]; then
              echo "::error::Refusing to stage in CI with a long-lived $v token — OIDC is the only sanctioned path." >&2
              exit 1
            fi
          done
          # Snapshot what's already staged ONCE so a re-run after a partial
          # failure skips the packages that made it through last time instead
          # of re-attempting all 9 (npm rejects a re-stage of an already-staged
          # version, which used to surface as "N failures" for a single
          # genuine failure).
          already_staged() {
            node -e '
              const raw = require("fs").readFileSync(0, "utf8")
              let list
              try { list = JSON.parse(raw) } catch { list = [] }
              const arr = Array.isArray(list) ? list : Object.values(list || {})
              const [n, v] = process.argv.slice(1)
              process.exit(arr.some(e => (e.name || e.packageName) === n && e.version === v) ? 0 : 1)
            ' "$1" "$2" <<<"$STAGED_JSON"
          }
          STAGED_JSON=$(npm stage list --json 2>/dev/null || echo '[]')
          failed=""
          for pkg in ./npm/perry-*; do
            name=$(node -p "require('$pkg/package.json').name")
            ver=$(node -p "require('$pkg/package.json').version")
            if already_staged "$name" "$ver"; then
              echo "=== $name@$ver already staged — skipping ==="
              continue
            fi
            echo "=== staging $name@$ver ==="
            if ! npm stage publish "$pkg" --access public --tag "$DIST_TAG" --ignore-scripts --provenance; then
              echo "::error::npm stage publish failed for $name@$ver — continuing" >&2
              failed="$failed $name@$ver"
            fi
          done
          # Wrapper LAST (optionalDependencies must be staged first).
          name=$(node -p "require('./npm/perry/package.json').name")
          ver=$(node -p "require('./npm/perry/package.json').version")
          if already_staged "$name" "$ver"; then
            echo "=== $name@$ver (wrapper) already staged — skipping ==="
          else
            echo "=== staging $name@$ver (wrapper, last) ==="
            if ! npm stage publish ./npm/perry --access public --tag "$DIST_TAG" --ignore-scripts --provenance; then
              echo "::error::npm stage publish failed for $name@$ver" >&2
              failed="$failed $name@$ver"
            fi
          fi
          if [ -n "$failed" ]; then
            echo "::error::staging failures:$failed" >&2
            exit 1
          fi
          echo "All 9 packages staged (not public). Next: npm run publish:approve locally."

      - name: Socket scan the staged tarballs
        # Mandatory, same as the local pipeline — CI scans what it just staged
        # immediately, rather than leaving the ONLY scan gate to whichever
        # human later remembers to run `publish:approve` correctly. Reuses
        # pipeline.mts's --scan-only path (list staged entries, sha1-verify,
        # Socket full scan) instead of duplicating that logic here — same
        # code, same gate, whether it runs in CI or locally.
        if: env.PUBLISH == 'true'
        run: node scripts/publish/pipeline.mts --scan-only

      - name: Bundle exact staged-package proofs
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          mapfile -t proofs < <(
            find npm -mindepth 2 -maxdepth 2 -type f -name '*.tgz' | sort
          )
          if [ "${#proofs[@]}" -ne 9 ]; then
            echo "::error::Expected 9 exact tarballs after verify + scan; found ${#proofs[@]}." >&2
            printf '  %s\n' "${proofs[@]}" >&2
            exit 1
          fi
          tar -cf npm-staged-package-proofs.tar "${proofs[@]}"

      - name: Retain exact staged-package proofs for local 2FA approval
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-staged-package-proofs
          path: npm-staged-package-proofs.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # the nine .tgz payloads are already compressed
