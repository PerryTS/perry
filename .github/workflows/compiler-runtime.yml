          path: .npm-sweep-results/
          if-no-files-found: ignore
          retention-days: 90
    needs:
      - route-compatibility
    if: ${{ needs.route-compatibility.result == 'success' && fromJSON(needs.route-compatibility.outputs.plan)['npm-package-sweep'] }}
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    permissions:
      contents: read
      pull-requests: read
