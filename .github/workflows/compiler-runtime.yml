                 if results.get(job, {}).get('result') not in {'success', 'skipped'}}
          if bad:
              print('Suite job failures:', json.dumps(bad, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          print(f'{len(ids)} suite jobs completed or were intentionally skipped')
          PY
  tls-budget__self-test-checkers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Self-test the budget verdict logic
        run: python3 scripts/tls_budget_check.py --self-test
      - name: Self-test the pre-attach liveness check
        run: bash scripts/tls_budget_gate.sh --self-test
      - name: Self-test the thread-local policy checker
        run: python3 scripts/check_thread_locals.py --self-test
      - name: Enforce the thread-local policy ratchet
        run: python3 scripts/check_thread_locals.py
    needs:
      - route-performance
    if: ${{ needs.route-performance.result == 'success' && fromJSON(needs.route-performance.outputs.plan)['tls-budget'] }}
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    permissions:
      contents: read
      pull-requests: read
    name: tls-budget / self-test-checkers
  tls-budget__tls-budget:
    if: ${{ needs.route-performance.result == 'success' && fromJSON(needs.route-performance.outputs.plan)['tls-budget'] && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-extended-tests')) }}
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Decide whether this change can affect thread-local access cost
        id: relevance
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request; running the gate."
            exit 0
          fi
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > changed.txt
          # Deliberately broad: any runtime change can add a thread-local to a
          # hot path, and the whole point of this gate is that such a change
          # does not announce itself. The filter exists only to spare docs-only
          # PRs a compiler build.
          if grep -qE '^(crates/|benchmarks/tls-budget/|scripts/tls_budget_(gate\.sh|check\.py)$|scripts/check_thread_locals\.py$|Cargo\.(toml|lock)$|\.github/workflows/(tls-budget|compiler-runtime)\.yml$|scripts/(actions_catalog\.json|actions_plan\.py|check_actions_topology\.py|test_actions_plan\.py)$)' changed.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Change touches a path that can move thread-local access cost."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No relevant paths changed."
          fi
      - name: Install Rust toolchain
        if: steps.relevance.outputs.run == 'true'
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22
        if: steps.relevance.outputs.run == 'true'
      - uses: ./.github/actions/perry/Swatinem/rust-cache
        if: steps.relevance.outputs.run == 'true'
        with:
          shared-key: "${{ runner.os }}-perry"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build perry and the runtime archives
        if: steps.relevance.outputs.run == 'true'
        run: |
          set -euo pipefail
          # perry-runtime and perry-stdlib are rlib-only; libperry_runtime.a
          # and libperry_stdlib.a come from the -static wrapper crates. Building
          # without them links a stale archive and makes the measurement
          # vacuous (CLAUDE.md, "Verifying a runtime change").
          cargo build --release -p perry -p perry-runtime-static -p perry-stdlib-static
          for artifact in perry libperry_runtime.a libperry_stdlib.a; do
            test -s "target/release/$artifact" \
              || { echo "::error::target/release/$artifact was not produced"; exit 1; }
          done
      - name: Measure the `_tlv_get_addr` budget
        if: steps.relevance.outputs.run == 'true'
        env:
          PERRY_RUNTIME_DIR: ${{ github.workspace }}/target/release
          PERRY_NO_AUTO_OPTIMIZE: "1"
        run: scripts/tls_budget_gate.sh target/release/perry "${{ runner.temp }}/tls-budget"
      - name: Attach the profiles
        if: always() && steps.relevance.outputs.run == 'true'
        uses: ./.github/actions/perry/actions/upload-artifact
        with:
          name: tls-budget-profiles
          path: ${{ runner.temp }}/tls-budget/*.sample
          if-no-files-found: warn
    needs:
      - route-performance
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "13.0"

    name: tls-budget / tls-budget
  tls-budget:
    name: tls-budget / suite result
    needs:
      - route-performance
      - tls-budget__self-test-checkers
      - tls-budget__tls-budget
    if: ${{ always() && (needs.route-performance.result == 'success' && fromJSON(needs.route-performance.outputs.plan)['tls-budget']) }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHILD_JOB_IDS: '["tls-budget__self-test-checkers","tls-budget__tls-budget"]'
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check suite jobs
        shell: bash
        run: |-
          python3 - <<'PY'
          import json, os, sys
          ids = json.loads(os.environ['CHILD_JOB_IDS'])
          results = json.loads(os.environ['JOB_RESULTS'])
          bad = {job: results.get(job, {}).get('result', 'missing') for job in ids
                 if results.get(job, {}).get('result') not in {'success', 'skipped'}}
          if bad:
              print('Suite job failures:', json.dumps(bad, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          print(f'{len(ids)} suite jobs completed or were intentionally skipped')
          PY
