    name: wasi-check / suite result
    needs:
      - route-compatibility
      - wasi-check__wasi-check
      - wasi-check__wasi-codegen
    if: ${{ always() && (needs.route-compatibility.result == 'success' && fromJSON(needs.route-compatibility.outputs.plan)['wasi-check']) }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHILD_JOB_IDS: '["wasi-check__wasi-check","wasi-check__wasi-codegen"]'
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check suite jobs
        shell: bash
        run: |-
          python3 - <<'PY'
          import json, os, sys
          ids = json.loads(os.environ['CHILD_JOB_IDS'])
          results = json.loads(os.environ['JOB_RESULTS'])
          bad = {job: results.get(job, {}).get('result', 'missing') for job in ids
                 if results.get(job, {}).get('result') not in {'success', 'skipped'}}
          if bad:
              print('Suite job failures:', json.dumps(bad, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          print(f'{len(ids)} suite jobs completed or were intentionally skipped')
          PY
  npm-package-sweep__compile-packages-sweep:
    name: npm-package-sweep / compile-packages-sweep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "true"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22
      - uses: ./.github/actions/perry/Swatinem/rust-cache
        with:
          shared-key: "${{ runner.os }}-perry-npm-sweep"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Node.js
        uses: ./.github/actions/perry/actions/setup-node
        with:
          node-version-file: .node-version
      - name: Build Perry release binary
        run: cargo build --release -p perry-runtime -p perry-stdlib -p perry-runtime-static -p perry-stdlib-static -p perry
      - name: Run npm package sweep
        env:
          SWEEP_PACKAGES: ${{ fromJSON(needs.route-compatibility.outputs.module_inputs)['npm-package-sweep'].packages }}
          SWEEP_LIMIT: ${{ fromJSON(needs.route-compatibility.outputs.module_inputs)['npm-package-sweep'].limit }}
          SWEEP_STRICT: ${{ fromJSON(needs.route-compatibility.outputs.module_inputs)['npm-package-sweep'].strict }}
        run: |
          set -euo pipefail
          mkdir -p .npm-sweep-results
          flags=(
            --perry-bin "$GITHUB_WORKSPACE/target/release/perry"
            --out-dir .npm-sweep-results
            --history test-compat/npm-sweep-history.csv
            --limit "${SWEEP_LIMIT:-6}"
          )
          if [[ -n "${SWEEP_PACKAGES:-}" ]]; then
            flags+=(--packages "$SWEEP_PACKAGES")
          fi
          if [[ "${SWEEP_STRICT:-false}" == "true" ]]; then
            flags+=(--strict)
          fi

          set +e
          python3 test-compat/npm-sweep/run.py "${flags[@]}"
          sweep_rc=$?
          set -e

          cp test-compat/npm-sweep-history.csv .npm-sweep-results/npm-sweep-history.csv
