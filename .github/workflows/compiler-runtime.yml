          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22
      - name: Measure clean-build time
        run: |
          mkdir -p .bench-results
          # Three clean builds, report median
          TIMES=()
          for i in 1 2 3; do
            cargo clean -q
            START=$(date +%s)
            cargo build --release -q
            END=$(date +%s)
            ELAPSED=$((END - START))
            echo "run $i: ${ELAPSED}s"
            TIMES+=("$ELAPSED")
          done
          python3 <<PY > .bench-results/compile-time.json
          import json, subprocess
          times = sorted([$(IFS=,; echo "${TIMES[*]}")])
          median = times[1]
          commit = subprocess.run(["git","rev-parse","--short","HEAD"],capture_output=True,text=True).stdout.strip()
          print(json.dumps({"commit": commit, "clean_build_seconds_median": median, "samples": times}))
          PY
          cat .bench-results/compile-time.json

          # Emit summary
          MEDIAN=$(python3 -c "import json; print(json.load(open('.bench-results/compile-time.json'))['clean_build_seconds_median'])")
          {
            echo "## Compile-Time Check"
            echo ""
            echo "Clean \`cargo build --release\` (median of 3): **${MEDIAN}s**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compile-time results
        if: always()
        uses: ./.github/actions/perry/actions/upload-artifact
        with:
          name: compile-time-${{ github.sha }}
          path: .bench-results/compile-time.json
          retention-days: 90
