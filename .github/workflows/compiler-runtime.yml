  # Integration suites
  route-integration:
    name: integration / suite routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.route.outputs.plan }}
      selection: ${{ steps.route.outputs.selection }}
      module_inputs: ${{ steps.route.outputs.module_inputs }}
    steps:
      - name: Checkout workflow source for routing
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth 1 origin "$CHECKOUT_REF"
          git checkout --force --detach FETCH_HEAD
      - name: Route suites
        id: route
        env:
          SUITE: ${{ inputs.suite }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--category integration --event "$EVENT_NAME" --event-path "$EVENT_PATH" --ref "$REF")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 scripts/ci_pr_files.py "$GITHUB_REPOSITORY" "$PR_NUMBER" --expected-head "$PR_HEAD_SHA" > changed-files.txt
            args+=(--changed-files changed-files.txt)
          fi
          args+=(--suite "${SUITE:-}")
          python3 scripts/actions_plan.py "${args[@]}"
  container-tests__hermetic:
