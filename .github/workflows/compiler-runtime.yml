          node-version-file: .node-version
      - name: Build perry with the WASI target
        run: cargo build --locked --profile perry-dev -p perry --features target-wasi
      - name: wasm32 IR matches the runtime ABI
        if: runner.os != 'Windows'
        run: ./scripts/wasi_ir_check.sh target/perry-dev/perry
      - name: Install the WASI toolchain
        if: runner.os != 'Windows'
        run: ./scripts/wasi_toolchain.sh "$RUNNER_TEMP/wasi" | sed -e 's/^export //' -e "s/'//g" >> "$GITHUB_ENV"
      - name: Install Windows WASI tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . ./scripts/wasi_toolchain.ps1 "$env:RUNNER_TEMP/wasi"
          foreach ($key in @('WASI_SDK_PATH', 'WASMTIME', 'CC_wasm32_wasip2', 'AR_wasm32_wasip2', 'CFLAGS_wasm32_wasip2', 'CC_SHELL_ESCAPED_FLAGS')) {
            "$key=$([Environment]::GetEnvironmentVariable($key))" >> $env:GITHUB_ENV
          }
      - name: Build the runtime for wasm32-wasip2
        run: python scripts/wasi_build_runtime.py
      - name: WASI smoke and complete issue 11375 acceptance
        shell: bash
        run: |
          compiler=target/perry-dev/perry
          if [[ "$RUNNER_OS" == Windows ]]; then compiler="$compiler.exe"; fi
          python scripts/wasi_run.py "$compiler" --suite smoke
          python scripts/wasi_run.py "$compiler" --suite acceptance
      - name: All WASI gap probes match the pinned Node oracle
        shell: bash
        run: |
          compiler=target/perry-dev/perry
          if [[ "$RUNNER_OS" == Windows ]]; then compiler="$compiler.exe"; fi
          python scripts/wasi_run.py "$compiler" --suite gap
    needs:
      - route-compatibility
    env:
