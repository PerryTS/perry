        with:
          name: tak-performance-${{ github.sha }}
          path: .tak-results/
          if-no-files-found: warn
          retention-days: 90
    needs:
      - route
    if: ${{ needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['tak-performance'] }}
    permissions:
      contents: write
      actions: read
    name: tak Performance Report / report
