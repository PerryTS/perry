name: Performance
run-name: ${{ format('Performance / {0} / {1}', inputs.suite || 'scheduled', github.ref_name) }}
on:
  pull_request:
    types:
    - labeled
    - opened
    - reopened
    - synchronize
  push:
    tags:
    - v*
  release:
    types:
    - published
  schedule:
  - cron: 0 3 * * *
  - cron: 27 */6 * * *
  - cron: 30 4 * * *
  workflow_dispatch:
    inputs:
      suite:
        description: Performance suite or all suites.
        type: choice
        options:
        - all
        - benchmark
        - tak-performance
        - tls-budget
        default: all
permissions: {}
concurrency:
  group: performance-${{ github.event_name == 'pull_request' && github.ref || github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.route.outputs.plan }}
      selection: ${{ steps.route.outputs.selection }}
      module_inputs: ${{ steps.route.outputs.module_inputs }}
    steps:
    - uses: ./.github/actions/perry/actions/checkout
      with:
        ref: ${{ github.sha }}
        fetch-depth: '1'
        persist-credentials: 'false'
    - name: Route suites
      id: route
      env:
        SUITE: ${{ inputs.suite }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PATH: ${{ github.event_path }}
        REF: ${{ github.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      shell: bash
      run: |
        set -euo pipefail
        args=(--category performance --event "$EVENT_NAME" --event-path "$EVENT_PATH" --ref "$REF")
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          python3 scripts/ci_pr_files.py "$GITHUB_REPOSITORY" "$PR_NUMBER" --expected-head "$PR_HEAD_SHA" > changed-files.txt
          args+=(--changed-files changed-files.txt)
        fi
        args+=(--suite "${SUITE:-}")
        python3 scripts/actions_plan.py "${args[@]}"
        pull_request\" ]]; then\n  python3 scripts/ci_pr_files.py \"$GITHUB_REPOSITORY\"\
        \ \"$PR_NUMBER\" --expected-head \"$PR_HEAD_SHA\" > changed-files.txt\n  args+=(--changed-files\
        \ changed-files.txt)\nfi\nargs+=(--suite \"${SUITE:-}\")\npython3 scripts/actions_plan.py\
        \ \"${args[@]}\"\n"
  benchmark:
    name: benchmark
    needs: route
    if: needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['benchmark']
    permissions:
      contents: write
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    uses: ./.github/workflows/benchmark.yml
  tak-performance:
    name: tak-performance
    needs: route
    if: needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['tak-performance']
    permissions:
      contents: write
      actions: read
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    uses: ./.github/workflows/tak-performance.yml
  tls-budget:
    name: tls-budget
    needs: route
    if: needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['tls-budget']
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/tls-budget.yml
