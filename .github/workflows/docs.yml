name: Deploy Docs
on:
  # Deploy docs on release tags so the public site stays pinned to the
  # latest released binary. Use workflow_dispatch to push out-of-band fixes
  # (typos, clarifications) without waiting for the next release.
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mdBook and gettext tooling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source docs/i18n-toolchain.env
          sudo apt-get update
          sudo apt-get install -y gettext
          gettext_actual=$(msgmerge --version | head -n 1)
          if [ "$gettext_actual" != "msgmerge (GNU gettext-tools) ${GETTEXT_VERSION}" ]; then
            echo "::error::Expected gettext ${GETTEXT_VERSION}; found ${gettext_actual}"
            exit 1
          fi
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.cargo/bin"
      - name: Install mdbook-i18n-helpers
        run: |
          source docs/i18n-toolchain.env
          cargo install mdbook-i18n-helpers --locked --version "$MDBOOK_I18N_VERSION"
      - name: Build docs (all languages)
        run: |
          ./docs/i18n.sh extract
          ./docs/i18n.sh sync
          git diff --exit-code -- docs/po
          for catalog in docs/po/*.po; do
            msgfmt --check --check-format --statistics --output-file=/dev/null "$catalog"
          done
          ./docs/i18n.sh build-all
          cp docs/CNAME docs/book/CNAME
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/book
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
