name: Deploy Docs
env:
  MDBOOK_VERSION: v0.5.4
on:
  # Deploy docs on release tags so the public site stays pinned to the
  # latest released binary. Use workflow_dispatch to push out-of-band fixes
  # (typos, clarifications) without waiting for the next release.
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mdBook and gettext tooling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          mkdir -p "$HOME/.cargo/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.cargo/bin"
      - name: Install mdbook-i18n-helpers
        run: cargo install mdbook-i18n-helpers --locked --version 0.4.0
      - name: Build docs (all languages)
        run: |
          ./docs/i18n.sh extract
          ./docs/i18n.sh sync
          git diff --exit-code -- docs/po
          for catalog in docs/po/*.po; do
            msgfmt --check --check-format --statistics --output-file=/dev/null "$catalog"
          done
          ./docs/i18n.sh build-all
          cp docs/CNAME docs/book/CNAME
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/book
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
