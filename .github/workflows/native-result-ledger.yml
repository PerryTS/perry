name: Native Result Ledger

on:
  pull_request:
    paths:
      - "crates/perry-codegen/src/lower_call/native_table/**"
      - "scripts/native_result_ledger.py"
      - "scripts/native_result_ledger.tsv"
      - ".github/workflows/native-result-ledger.yml"
  push:
    branches: [main]
    paths:
      - "crates/perry-codegen/src/lower_call/native_table/**"
      - "scripts/native_result_ledger.py"
      - "scripts/native_result_ledger.tsv"
      - ".github/workflows/native-result-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-result-ledger-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "true"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Prove and run the typed-result inventory
        run: |
          python3 scripts/native_result_ledger.py --self-test
          python3 scripts/native_result_ledger.py
