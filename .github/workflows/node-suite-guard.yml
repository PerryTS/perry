name: Node Suite Regression Guard

# Wires scripts/node_suite_regression_check.py (roadmap I-02) into CI. That
# guard runs the full print-and-diff node-suite and FAILS if any baselined
# module's pass count drops below its floor (test-parity/node_suite_baseline.json,
# oracle node 26). It was written verbatim because node:dns once silently went
# 83% -> 0% behind a green build, yet until now it ran in ZERO workflows.
#
# Decoupled from the (not-yet-enabled) merge queue on purpose: it runs nightly
# and on demand today, and the `merge_group` trigger below is INERT until a
# maintainer turns the merge queue on in branch protection — at which point this
# guard automatically gates every merge with no further workflow change.
on:
  workflow_dispatch:
  schedule:
    # Nightly, offset from the Node Core Subset Radar (17 3) to avoid overlap.
    - cron: "37 4 * * *"
  # Inert until the merge queue is enabled in branch protection; then this guard
  # runs once per merge against the actual merged tree.
  merge_group:

permissions:
  contents: read

concurrency:
  # #7966: keyed per RUN for non-PR events. A group that is constant across
  # scheduled runs lets only the first one execute -- GitHub keeps at most one
  # PENDING run per group and cancels the rest with `jobs: 0`, regardless of
  # `cancel-in-progress`. PR runs keep the shared per-ref group so superseded
  # pushes still coalesce. Enforced by scripts/gc_gate_wiring_check.py.
  group: node-suite-guard-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CACHE_SIZE: "2G"
  CARGO_INCREMENTAL: "0"

jobs:
  node-suite-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22

      - name: Start sccache
        uses: ./.github/actions/perry/mozilla-actions/sccache-action # v0.0.11

      - uses: ./.github/actions/perry/Swatinem/rust-cache # v2
        with:
          shared-key: "${{ runner.os }}-perry"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        # Node 26 is the oracle the node_suite_baseline.json floors were
        # captured on; running any other major would compare against the
        # wrong reference and produce spurious regressions.
        uses: ./.github/actions/perry/actions/setup-node # v7
        with:
          # Single source of truth: .node-version at the repo root.
          node-version-file: .node-version

      - name: Build Perry release binary
        run: cargo build --release -p perry -p perry-runtime -p perry-stdlib -p perry-runtime-static -p perry-stdlib-static

      - name: Node-suite regression guard (floor baseline, node 26)
        # Fails (exit 1) if any baselined module drops below its floor;
        # improvements are accepted and reported as +N. pipefail propagates the
        # script's exit through the tee into the step.
        run: |
          set -euo pipefail
          echo '### Node-suite regression guard (node 26)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/node_suite_regression_check.py target/release/perry . \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
