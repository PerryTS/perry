name: Simulator Tests (iOS)

# Tier-2 UI doc-example verification: compile for --target ios-simulator,
# install on a booted simulator, launch with PERRY_UI_TEST_MODE=1, check
# for clean exit. Slower than the PR-gate doc-tests because the simulator
# cold-boot takes 30-60s; run on tag pushes and manual dispatch, not on
# every PR.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      device:
        description: "Simulator device name (default: iPhone 15)"
        required: false
        default: "iPhone 15"

concurrency:
  group: simctl-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  simctl:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "true"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22

      - name: Install iOS simulator Rust target
        run: rustup target add aarch64-apple-ios-sim aarch64-apple-ios

      - name: Cache cargo
        uses: ./.github/actions/perry/actions/cache # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # These archives embed the Perry commit, while the builder treats an
      # existing archive as fresh. Keep the broader target cache warm, but
      # force this commit-stamped subtree to be rebuilt after every restore.
      - name: Invalidate cached Geisterhand archives (#9037)
        run: |
          rm -rf target/geisterhand
          test ! -e target/geisterhand

      - name: Build perry + iOS UI lib
        run: |
          cargo build --release -p perry -p perry-runtime -p perry-stdlib -p perry-runtime-static -p perry-stdlib-static
          cargo build --release -p perry-ui-ios --target aarch64-apple-ios-sim

      # Regression guard for #1311 — the geisterhand glue (perry-ui-ios's
      # geisterhand_style.rs + ffi/system.rs) must compile against the iOS UI
      # crate AND link without a runtime symbol-hash mismatch. Compile-only the
      # device-target libs (catches the E0425 "cannot find ... in the crate
      # root" class), then do a full `perry compile --enable-geisterhand` for
      # the simulator (the successful link catches the app_group/stub_diag
      # symbol-resolution class end-to-end).
      - name: Geisterhand iOS compile smoke (#1311)
        run: |
          cargo build --release -p perry-ui-ios --features geisterhand --target aarch64-apple-ios
          cargo build --release -p perry-ui-geisterhand
          ./target/release/perry compile docs/examples/ui/testing/geisterhand_demo.ts \
            --target ios-simulator --enable-geisterhand \
            -o "$RUNNER_TEMP/geisterhand_demo_ios"

      - name: Run simctl doc-example verification
        run: ./scripts/run_simctl_tests.sh
        timeout-minutes: 45
        env:
          DEVICE: ${{ github.event.inputs.device || 'iPhone 15' }}

      - name: Upload simctl logs
        if: always()
        uses: ./.github/actions/perry/actions/upload-artifact # v7
        with:
          name: simctl-logs
          path: target/perry-simctl-tests/*.log
          if-no-files-found: warn
