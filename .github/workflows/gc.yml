            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Decide whether this change can affect the layout-state / parse-churn path
        id: relevance
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request; running the gate."
            exit 0
          fi
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > changed.txt
          # Deliberately broad, same rationale as gc-moving-witnesses.yml:
          # anything under crates/ can move the collector or change how JSON
          # parses, and the filter exists only to spare docs-only PRs a
          # compiler build.
          if grep -qE '^(crates/|scripts/gc_parse_churn_layout_(gate\.sh|check\.py)$|scripts/fixtures/gc_parse_churn_layout_state\.ts$|Cargo\.(toml|lock)$|\.github/workflows/(gc-parse-churn-gate|gc)\.yml$|scripts/(actions_catalog\.json|actions_plan\.py|check_actions_topology\.py|test_actions_plan\.py)$)' changed.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Change touches a collector- or JSON-parse-relevant path; running the gate."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No relevant paths changed."
          fi
      - name: Install Rust toolchain
        if: steps.relevance.outputs.run == 'true'
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22
        if: steps.relevance.outputs.run == 'true'
      - uses: ./.github/actions/perry/Swatinem/rust-cache
        if: steps.relevance.outputs.run == 'true'
        with:
          shared-key: "${{ runner.os }}-perry"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install clang
        if: steps.relevance.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Build perry and the runtime archives
        if: steps.relevance.outputs.run == 'true'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C linker-features=-lld"
        run: |
          set -euo pipefail
          # perry-runtime/perry-stdlib are rlib-only; libperry_{runtime,stdlib}.a
          # come from the *-static wrapper crates. Building without them links
          # a stale archive and makes this whole gate vacuous in a way nothing
          # downstream can detect (CLAUDE.md's "Verifying a runtime change").
          cargo build --release \
            -p perry -p perry-runtime -p perry-stdlib \
            -p perry-runtime-static -p perry-stdlib-static
          for artifact in perry libperry_runtime.a libperry_stdlib.a; do
            test -s "target/release/$artifact" \
              || { echo "::error::target/release/$artifact was not produced"; exit 1; }
          done
      - name: Run the parse-then-churn layout-state gate
        if: steps.relevance.outputs.run == 'true'
        run: scripts/gc_parse_churn_layout_gate.sh target/release/perry
    needs:
      - route
    env:
      CARGO_TERM_COLOR: always

    name: gc-parse-churn-gate / gc-parse-churn-gate
  gc-parse-churn-gate:
    name: gc-parse-churn-gate / suite result
    needs:
      - route
      - gc-parse-churn-gate__self-test-checker
      - gc-parse-churn-gate__gc-parse-churn-gate
    if: ${{ always() && (needs.route.result == 'success' && fromJSON(needs.route.outputs.plan)['gc-parse-churn-gate']) }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHILD_JOB_IDS: '["gc-parse-churn-gate__self-test-checker","gc-parse-churn-gate__gc-parse-churn-gate"]'
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check suite jobs
        shell: bash
        run: |-
          python3 - <<'PY'
          import json, os, sys
          ids = json.loads(os.environ['CHILD_JOB_IDS'])
          results = json.loads(os.environ['JOB_RESULTS'])
          bad = {job: results.get(job, {}).get('result', 'missing') for job in ids
                 if results.get(job, {}).get('result') not in {'success', 'skipped'}}
          if bad:
              print('Suite job failures:', json.dumps(bad, sort_keys=True), file=sys.stderr)
              raise SystemExit(1)
          print(f'{len(ids)} suite jobs completed or were intentionally skipped')
          PY
