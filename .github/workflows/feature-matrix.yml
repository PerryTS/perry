name: TypeScript Feature Matrix

on:
  # Advisory language-feature drift signal — NOT a required gate. Runs on a
  # nightly schedule and on demand only; intentionally NOT on pull_request.
  #
  # The check regenerates the matrix and diffs it against the committed
  # snapshot (test-features/feature_matrix.md), so any single regressed row
  # (a probe that flips PASS/DIFF/RUNTIME-FAIL) fails it on *every* PR that
  # touches the compiler, regardless of that PR's content. Surfacing drift as
  # a red, required-looking check on unrelated PRs is noise; the nightly run
  # plus the uploaded artifact/summary is the actual signal.
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"

permissions:
  contents: read

concurrency:
  # #7966: keyed per RUN for non-PR events. A group that is constant across
  # scheduled runs lets only the first one execute -- GitHub keeps at most one
  # PENDING run per group and cancels the rest with `jobs: 0`, regardless of
  # `cancel-in-progress`. PR runs keep the shared per-ref group so superseded
  # pushes still coalesce. Enforced by scripts/gc_gate_wiring_check.py.
  group: feature-matrix-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  feature-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "true"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22

      - uses: ./.github/actions/perry/Swatinem/rust-cache # v2
        with:
          shared-key: "${{ runner.os }}-perry-feature-matrix"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: ./.github/actions/perry/actions/setup-node # v7
        with:
          # Single source of truth: .node-version at the repo root.
          node-version-file: .node-version

      - name: Build Perry release binary
        run: cargo build --release -p perry -p perry-runtime -p perry-stdlib -p perry-runtime-static -p perry-stdlib-static

      - name: Check feature matrix
        run: |
          set -euo pipefail
          mkdir -p .feature-matrix
          python3 scripts/gen_feature_matrix.py \
            --check \
            --node-bin node \
            --perry-bin "$GITHUB_WORKSPACE/target/release/perry" \
            --report .feature-matrix/feature_matrix.json \
            --generated-output .feature-matrix/feature_matrix.md

      - name: Write matrix summary
        if: always()
        run: |
          if [[ -f .feature-matrix/feature_matrix.md ]]; then
            cat .feature-matrix/feature_matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            cat test-features/feature_matrix.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload feature matrix artifacts
        if: always()
        uses: ./.github/actions/perry/actions/upload-artifact # v7
        with:
          name: feature-matrix-${{ github.sha }}
          path: |
            .feature-matrix/feature_matrix.json
            .feature-matrix/feature_matrix.md
          if-no-files-found: ignore
          retention-days: 90
