name: zizmor

on:
  push:
    branches: [main]
    # #7966: the push arm was UNFILTERED while the PR arm was already scoped to
    # `.github/**`, so every merge queued a zizmor run whose subject could not
    # have changed. Measured 2026-08-12: 90 queued `push`/`main` zizmor runs,
    # ~6% of a 1,529-deep queue that had ten `main` gates dark behind it. This
    # is a static analyser over workflow files; a merge that touches no workflow
    # file has nothing for it to say. The PR arm (unchanged) still scans every
    # workflow edit before it can merge, and this arm still covers a direct
    # admin push to `main`, which is the case the PR arm structurally misses.
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

permissions: {}

concurrency:
  # This workflow had NO concurrency block, so superseded PR pushes never
  # coalesced and every push to a busy branch added a run that nothing would
  # ever read. Per-ref for PRs (supersede), per-RUN for `main` pushes -- a
  # constant group would let only the first main-line run execute and cancel the
  # rest with `jobs: 0` (#7205/#7966). Enforced by scripts/gc_gate_wiring_check.py.
  group: zizmor-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # zizmor rides the same SRI-pinned rack as every other external tool
      # (external-tools.json tools.zizmor) instead of a marketplace action —
      # one pin source, and local `npm run tools:install` audits with the
      # exact same binary CI does.
      - name: Install pinned zizmor
        env:
          # download() attaches this to github.com fetches only (release
          # assets) — avoids unauthenticated rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/soak/external-tools.mts --install zizmor
          node scripts/soak/external-tools.mts --print-bin >> "$GITHUB_PATH"
      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pass the token only when non-empty: zizmor treats an empty
          # --gh-token as a real token, then fatally errors when its online
          # impostor-commit check can't authenticate.
          #
          # Starting gate: high only (config in .github/zizmor.yml). The 34
          # medium findings (missing permissions: blocks in test.yml /
          # benchmark.yml / container-tests.yml / cache-warm.yml /
          # simctl-tests.yml) are a tracked ratchet — audit each job's real
          # token needs, add the blocks, then gate at medium.
          if [ -n "${GH_TOKEN}" ]; then
            zizmor .github/ --gh-token "${GH_TOKEN}" --min-severity high
          else
            zizmor .github/ --min-severity high
          fi
