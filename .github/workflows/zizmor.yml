name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/**']

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          inputs: .github/
          # Version rides external-tools.json tools.zizmor (keep in lockstep
          # so local `npm run tools:install` audits with the same zizmor).
          version: "1.26.1"
          # Starting gate: high only. The 34 medium findings (missing
          # permissions: blocks in test.yml / benchmark.yml /
          # container-tests.yml / cache-warm.yml / simctl-tests.yml) are a
          # tracked ratchet — audit each job's real token needs, add the
          # blocks, then drop this line to gate at medium.
          min-severity: high
