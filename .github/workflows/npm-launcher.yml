name: npm launcher

# The @perryts/perry launcher decides which prebuilt binary a machine gets. That
# decision is invisible to every other job in CI — the compiler is never built or
# run through it — so install breakage on a whole distro family can (and did,
# #6298) ship unnoticed. This workflow exercises the launcher itself.
#
# Path-filtered: it only runs when the launcher or the install script changes.

on:
  pull_request:
    paths:
      - "npm/**"
      - "packaging/install.sh"
      - ".github/workflows/npm-launcher.yml"
  workflow_dispatch:

# This workflow installs and executes published registry content (the platform
# packages) — so it must not carry a writable token, and checkout must not leave
# a git credential on disk for that content to find.
permissions:
  contents: read

jobs:
  # Hermetic: no network, no platform packages — just the resolution rules.
  detect-self-test:
    name: Platform resolution self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - uses: ./.github/actions/perry/actions/setup-node # v7
        with:
          node-version-file: .node-version
      - run: node npm/perry/test/detect.test.cjs
      - name: install.sh is valid POSIX sh
        run: sh -n packaging/install.sh

  # Published-package verification for the platform from #6298. This is manual
  # because a PR changes the launcher before the matching old-glibc binary can
  # exist in npm; release-packages.yml exercises the just-built artifact inside
  # the glibc 2.31 build container before publication. Run this after a release to verify that
  # the registry package uses the native glibc build on Ubuntu 22.04.
  ubuntu-2204:
    if: github.event_name == 'workflow_dispatch'
    name: Ubuntu 22.04 native glibc end-to-end
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - uses: ./.github/actions/perry/actions/setup-node # v7
        with:
          node-version-file: .node-version

      - name: Host glibc
        run: |
          ldd --version | head -1
          node -p "'node reports glibcVersionRuntime: ' + process.report.getReport().header.glibcVersionRuntime"

      - name: Install @perryts/perry the way a user would
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e
          npm init -y >/dev/null 2>&1
          npm install @perryts/perry@latest --no-audit --no-fund
          echo "installed platform packages:"
          ls node_modules/@perryts/

      - name: Native glibc binary loads on Ubuntu 22.04
        run: |
          cd /tmp/e2e
          ./node_modules/@perryts/perry-linux-x64/bin/perry --version

      - name: Launcher under test routes to the native build
        run: |
          cd /tmp/e2e
          cp "$GITHUB_WORKSPACE/npm/perry/bin/perry.js" node_modules/@perryts/perry/bin/perry.js
          cp "$GITHUB_WORKSPACE/npm/perry/bin/detect.cjs" node_modules/@perryts/perry/bin/detect.cjs
          node node_modules/@perryts/perry/bin/perry.js --version

      # The in-process LLVM backend emits objects itself, but the final native
      # link still needs a system C toolchain. Install clang 15 explicitly so
      # this smoke does not depend on jammy's older default clang 14.
      - name: Install clang 15 (jammy default clang is too old for opaque-pointer IR)
        run: sudo apt-get update && sudo apt-get install -y clang-15

      - name: Compile and run a TypeScript program with the native binary
        env:
          PERRY_LLVM_CLANG: /usr/bin/clang-15
        run: |
          cd /tmp/e2e
          cat > hello.ts <<'TS'
          class Greeter {
            constructor(private who: string) {}
            greet(): string { return `hello ${this.who}`; }
          }
          const doubled = [1, 2, 3].map((x) => x * 2);
          console.log(new Greeter("22.04").greet(), doubled.join(","));
          TS
          node node_modules/@perryts/perry/bin/perry.js hello.ts -o hello
          ./hello
          test "$(./hello)" = "hello 22.04 2,4,6"
          echo "compiled binary links against:"
          ldd ./hello || true
