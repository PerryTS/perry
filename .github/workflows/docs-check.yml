name: Docs checks

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/check_docs.py"
      - "crates/perry-doc-tests/**"
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/check_docs.py"
      - "crates/perry-doc-tests/**"
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  build-and-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "true"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Fetch the docs deployed by the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          git fetch --depth=1 origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          echo "PERRY_DOCS_RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
      - name: Install mdBook and gettext tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          mkdir -p "$HOME/.cargo/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.cargo/bin"
          cargo install mdbook-i18n-helpers --locked --version 0.4.0
      - name: Check navigation, README release links, local links, anchors, and includes
        run: |
          python3 scripts/check_docs.py --self-test
          python3 scripts/check_docs.py
      - name: Check TypeScript fences
        run: cargo run --release --quiet -p perry-doc-tests -- --lint docs/src
      - name: Validate gettext catalogs
        run: |
          # Translation updates require review. Regenerating here rewrites
          # obsolete entries and can drop existing translations (#10955).
          for catalog in docs/po/*.po; do
            msgfmt --check --check-format --statistics --output-file=/dev/null "$catalog"
          done
      - name: Build English and all translations
        run: ./docs/i18n.sh build-all

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "true"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Install lychee
        run: cargo install lychee --locked --version 0.24.2
      - name: Check external links
        run: >-
          lychee
          --no-progress
          --max-retries 3
          --accept 200..=399,403,429
          --exclude 'https://www.npmjs.com/'
          --exclude 'https://xtermjs.org/'
          'README.md'
          'docs/src/**/*.md'
          'docs/*.md'
