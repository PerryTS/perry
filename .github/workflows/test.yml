name: Pinned main failure comparison
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "12G"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9e29f59d435ee08df161ef460ee6f204fb381d4f

      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-08-20 --profile minimal
      - uses: ./.github/actions/setup-llvm22

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Every shard starts from the same most-recent compiler-object cache.
      # Shards deliberately do not save eight near-duplicate 12G archives:
      # cargo-test remains the single main-line writer for this shared prefix.
      - name: Restore sccache objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-${{ runner.os }}-perry-${{ github.job }}-${{ github.run_id }}-comparison
          restore-keys: |
            sccache-${{ runner.os }}-perry-

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "${{ runner.os }}-perry"
          save-if: false

      - name: Evict stale auto-opt archives (#5892)
        run: |
          rm -rf target/perry-auto-* target/debug/libperry_ext_*.a 2>/dev/null || true

      # Same reason as the `cargo-test` job: these shards run `-p perry`
      # integration tests that shell out to node scripts asserting
      # `process.versions.node` equals the .node-version pin. Which shard a
      # node-backed test lands in is decided by ci_cargo_test_shard.py, so
      # leaving this job unpinned makes the failure move with the sharding
      # rather than stay fixed. From the FILE, not a literal — see
      # check_node_version_consistency.py.
      - name: Setup Node.js for the node-backed integration tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Compare exact failing tests against pinned main
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C linker-features=-lld"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -uo pipefail
          cargo build --release -p perry-runtime -p perry-stdlib -p perry-runtime-static -p perry-stdlib-static || exit $?
          export PERRY_RUNTIME_DIR="$PWD/target/release"
          export CARGO_BUILD_JOBS=1
          cargo test -p perry --no-fail-fast --test class_field_miss_one_path --test issue_10058_push_spread_scaling --test issue_4926_boxed_slot_skipped_init --test issue_10893_getter_call --test issue_4909_client_write_end_timeouts --test issue_5621_native_camel_export_routing
          perry_status=$?
          cargo test -p perry-hir --test issue_5833_global_code_cluster
          hir_status=$?
          echo "Comparison exit codes: perry=$perry_status hir=$hir_status"
          if [ "$perry_status" -ne 0 ] || [ "$hir_status" -ne 0 ]; then exit 1; fi
