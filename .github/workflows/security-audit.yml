name: Security Audit

on:
  # Called from .github/workflows/test.yml: in the PR tier only when the diff
  # touches a lockfile / manifest / policy file (scripts/ci_plan.py DEPS_GLOBS),
  # and unconditionally in the post-merge sweep and the full tier. That is why
  # there is no `pull_request` / `push` trigger here any more -- running these
  # five checks on every PR push was ~5 of the 48 runner slots each push burned
  # on a 20-slot org (see the header of test.yml).
  workflow_call:
  # Weekly on its own: the advisory database moves without any commit.
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per main COMMIT, cancelling PR runs only. Two separate problems
  # were live here, and this is a REQUIRED status check: it had NINE cancelled
  # `main` runs and zero executions.
  #
  # `cancel-in-progress: true` cancels main runs outright, and even `false`
  # would not have been enough — GitHub allows at most one PENDING run per
  # group and cancels the previously pending one when a new run enters,
  # regardless of that setting (#7205). Keying push runs on the SHA gives every
  # merged commit a group of its own.
  # ***#7966: KEY EVERY MAIN-LINE RUN ON `github.run_id`, NOT `github.sha`.***
  # The previous expression read `github.event_name == 'push' && github.sha ||
  # github.ref`. That was #7205's fix and it keyed on the event being `push` --
  # correct while the main-line arm WAS `push: branches: [main]`. #7856 moved the
  # main-line arm to `schedule:`, which falls through to `github.ref` (constant
  # `refs/heads/main`), so every scheduled run shared one group again and #7205
  # came straight back. Measured 2026-08-12 on all ten scheduled gates, the same
  # shape every time: oldest run `queued` holding the group, the two after it
  # `cancelled` with `jobs: 0`, newest `pending`. `github.run_id` is unique per
  # run, so schedule / tag-push / workflow_dispatch each get a group of their own
  # and none can supersede another. PR runs keep the shared per-ref group and
  # keep superseding themselves, which is still what we want.
  group: security-audit-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal
      - uses: ./.github/actions/setup-llvm22
      - uses: ./.github/actions/perry/Swatinem/rust-cache # v2
        with:
          shared-key: security-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # Default cargo-audit behavior: fail on `vulnerability` advisories
        # (real CVEs), surface `unmaintained` / `notice` / `unsound` /
        # `yanked` advisories as warnings.
        #
        # `--ignore` accepts specific RUSTSEC IDs that are acknowledged
        # transitive-dep advisories with no actionable upstream fix:
        #
        # - RUSTSEC-2023-0071 (rsa) — Marvin attack timing side-channel;
        #   upstream marks "No fixed upgrade is available". The rsa
        #   crate is a transitive dep through several stacks; tracking
        #   for upstream fix.
        # - RUSTSEC-2026-0118 / -0119 (hickory-proto) — DNS query
        #   amplification + DoS surface; transitive via reqwest's
        #   tls-rustls path. Upstream hickory has a fix in main but
        #   not yet released; tracking.
        # - RUSTSEC-2026-0187 (lopdf) — stack overflow via deeply nested
        #   PDF objects. Fixed in lopdf >=0.42.0, but lopdf is transitive
        #   via printpdf (perry-ext-pdf); printpdf's latest (0.9.1) still
        #   pins lopdf ^0.39, so there is no actionable upstream bump yet.
        #   (Re-checked 2026-08-07: printpdf 0.10.1 — the version dependabot
        #   proposes in #7412 — STILL pins lopdf 0.39.0, so that PR does not
        #   close this. See #7555.)
        # - RUSTSEC-2026-0235 (rkyv 0.7.46) — OOB reads validating archives
        #   containing Rc/Arc. **Not in Perry's build graph at all.** `rkyv`
        #   is an OPTIONAL feature of rust_decimal (`rkyv = ["dep:rkyv"]`);
        #   perry-stdlib enables only `features = ["maths"]`, so it is never
        #   activated. Verified three ways on 2026-08-07:
        #     * `cargo tree -e normal -i rkyv` -> "did not match any packages"
        #     * `cargo tree -p rust_decimal --depth 1 -e features` resolves to
        #       arrayvec / serde / num-traits only
        #     * zero `rkyv` artifacts in the dev or release deps directories
        #   cargo-audit reads Cargo.lock, which lists optional dependencies
        #   whether or not any feature activates them, so this is a
        #   lockfile-only finding. Re-evaluate if anything ever enables the
        #   `rkyv` or `rkyv-safe` feature of rust_decimal.
        #   perry-ext-pdf is a PDF *creation* API (createPdf/addText/…),
        #   not a parser of untrusted PDFs, so the deeply-nested-input
        #   surface is not reached. Tracking for a printpdf release that
        #   moves to lopdf >=0.42.
        #
        # Previously the job ran `--deny warnings` which also
        # escalated every "unmaintained crate" notice into a hard
        # failure (adler, fxhash, paste, number_prefix, bincode v1,
        # etc.) — those have no in-tree replacement and were blocking
        # merges without an actionable fix. Dropped that flag; warnings
        # still surface in the log.
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0118 \
            --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2026-0187 \
            --ignore RUSTSEC-2026-0235

      - name: Install cargo-deny
        run: which cargo-deny || cargo install cargo-deny --locked
      - name: Run cargo deny
        run: cargo deny check licenses bans sources

  # Soak parity gate + external-tool pin gate. Always-run (deliberately not
  # path-filtered — nub hid this gate in a path-gated job and it silently
  # skipped Rust-only PRs). The scripts are dep-free erasable-TS .mts run
  # with the pinned Node's native type stripping. The publish tests exercise
  # the Socket SDK wrapper, so install the lockfile-pinned dev dependencies.
  soak-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - uses: ./.github/actions/perry/actions/setup-node # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install script test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Soak window parity (npm run soak)
        run: node scripts/check/dependency-soak-is-current.mts
      - name: External-tool pins valid (npm run tools:check)
        run: node scripts/check/external-tools-are-valid.mts
      - name: Soak + publish script unit tests (npm run test:scripts)
        # `test:scripts` in package.json covers BOTH globs; this step ran only
        # the soak half, so every scripts/publish/*.test.mts case -- 31 of
        # them, guarding the staged npm release flow -- never executed in CI,
        # despite the step name claiming it ran test:scripts.
        run: node --test scripts/soak/*.test.mts scripts/publish/*.test.mts

  # AgentShield audits the operator-side Claude config (.claude/: hooks,
  # permissions, MCP servers, agents). SkillSpector audits skill content.
  # Both scans share a checkout and run concurrently after their tools are
  # installed, while retaining separate logs and exit status.
  config-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository (inline git)
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          CHECKOUT_DEPTH: "1"
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_PERSIST_CREDENTIALS: "false"
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 | tr -d '\n')"
          if [[ "$CHECKOUT_DEPTH" == "0" ]]; then
            git -c http.https://github.com/.extraheader="$auth_header" fetch --force --tags origin
            git checkout --force --detach "$CHECKOUT_REF"
          else
            git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --force --depth "$CHECKOUT_DEPTH" origin "$CHECKOUT_REF"
            git checkout --force --detach FETCH_HEAD
          fi
          if [[ "$CHECKOUT_PERSIST_CREDENTIALS" == "true" ]]; then
            git config http.https://github.com/.extraheader "$auth_header"
          fi
      - uses: ./.github/actions/perry/actions/setup-node # v7.0.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/perry/astral-sh/setup-uv # v10.2.0
        with:
          version: "0.12.23"
          add-problem-matchers: false
          cache-dependency-glob: |
            external-tools.json
            scripts/soak/constants.mts
      - name: Install pinned agentshield
        env:
          # download() attaches this to github.com fetches only (release
          # assets); without it private assets 404 and public ones ride
          # unauthenticated rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/soak/external-tools.mts --install agentshield
      - name: Run security scans concurrently
        run: |
          set -euo pipefail
          BIN_DIR="$(node scripts/soak/external-tools.mts --print-bin)"
          export PATH="$BIN_DIR:$PATH"
          skillspector_ref="$(jq -er '.tools.skillspector.version' external-tools.json)"
          soak_days="$(sed -nE 's/^export const SOAK_DAYS = ([0-9]+)$/\1/p' scripts/soak/constants.mts)"
          [[ -n "$soak_days" ]] || { echo "::error::SOAK_DAYS is missing"; exit 1; }
          exclude_newer="$(date -u -d "${soak_days} days ago" '+%Y-%m-%dT%H:%M:%SZ')"
          agent_log="$RUNNER_TEMP/agentshield.log"
          skills_log="$RUNNER_TEMP/skillspector.log"
          (
            agentshield scan
          ) >"$agent_log" 2>&1 &
          agent_pid=$!
          (
            set -euo pipefail
            for skill in .claude/skills/*/; do
              echo "::group::skillspector ${skill}"
              uv tool run --python 3.12 \
                --exclude-newer "$exclude_newer" \
                --from "git+https://github.com/NVIDIA/skillspector@${skillspector_ref}" \
                skillspector scan "${skill}" --no-llm
              echo "::endgroup::"
            done
          ) >"$skills_log" 2>&1 &
          skills_pid=$!

          agent_status=0
          if wait "$agent_pid"; then :; else agent_status=$?; fi
          skills_status=0
          if wait "$skills_pid"; then :; else skills_status=$?; fi

          echo '::group::AgentShield output'
          cat "$agent_log"
          echo '::endgroup::'
          echo '::group::SkillSpector output'
          cat "$skills_log"
          echo '::endgroup::'

          if [[ "$agent_status" -ne 0 || "$skills_status" -ne 0 ]]; then
            echo "::error::security scan failures (AgentShield=$agent_status, SkillSpector=$skills_status)"
            exit 1
          fi
