[package]
name = "issue-8075-stdlib-provider"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "issue_8075_stdlib"
crate-type = ["cdylib"]

[dependencies]
perry-stdlib = { path = "../../../../crates/perry-stdlib", default-features = false, features = ["full"] }

[profile.provider]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = false

[workspace]
