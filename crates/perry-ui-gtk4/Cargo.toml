[package]
name = "perry-ui-gtk4"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[target.'cfg(target_os = "linux")'.dependencies]
perry-ui = { path = "../perry-ui" }
perry-ui-testkit = { workspace = true }
perry-audio-miniaudio = { workspace = true }
perry-runtime = { path = "../perry-runtime" }
perry-ffi.workspace = true
perry-base64.workspace = true
libc.workspace = true
gtk4 = { version = "0.11", features = ["v4_10"] }
cairo-rs = "0.22"
# MapView: libshumate, GNOME's GTK4 vector-tile map widget (OSM tiles, no API key).
# libshumate and webkit6 minor versions track gtk4-rs; they share its `links = "gtk-4"`.
libshumate = "0.8"
# WebView: WebKitGTK 6.0 (libwebkitgtk-6.0-dev). webkit6 needs gtk4-rs `v4_10`, so GTK 4.10+
# (Ubuntu 24.04+, Debian 13+).
webkit6 = "0.6"
# XDG data/cache dirs for the persistent WebView session.
dirs.workspace = true
# perry/media: GStreamer playbin for streaming audio.
gstreamer = "0.25"
# CameraView: appsink frame pull for the v4l2 preview pipeline.
gstreamer-app = "0.25"
# perry/media: MPRIS over D-Bus (Linux-only; gated by cfg(target_os = "linux") in source).
# No tokio: without mpris-server's `tokio` feature, zbus runs on async-io with its own thread.
mpris-server = "0.10"
# System tray via StatusNotifierItem over D-Bus, the Linux tray protocol (pure Rust).
# ksni uses `async-io`: its `tokio` mode is mutually exclusive (`compile_error!`), and
# async-io mode runs its own executor thread, so no ambient runtime is needed.
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
# smol-family replacements for what tokio provided, already in the graph via ksni/zbus:
# async-executor (tray refresh thread), futures-lite (`block_on`) and async-channel
# (main thread -> MPRIS server pushes).
async-executor = "1"
futures-lite = "2"
async-channel = "2.5"

[features]
geisterhand = []
