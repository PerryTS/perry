[package]
name = "perry-ext-ws"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native bindings for npm `ws` — WebSocket client + server on turnloop-websocket's sans-I/O protocol core, driven entirely over turnloop handles. No async runtime."

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
perry-ffi.workspace = true
# The protocol, sans-I/O. This is what lets one codec serve every host: a
# `turnloop_websocket::Connection` is a state machine over byte slices, so it
# runs equally on a connection this crate dialled, one its own listener
# accepted, and one `perry-ext-http` owns. It replaced `tokio-tungstenite`,
# whose `WebSocketStream<S>` needs an owned `AsyncRead + AsyncWrite` that a
# turnloop connection cannot produce -- the blocker P5 recorded for the
# attached `WebSocketServer`.
turnloop-websocket = { workspace = true }
# The HTTP/1 head codec the upgrade handshake is expressed in. Already in the
# graph via turnloop-websocket; declared because this crate names its types.
turnloop-http = { workspace = true }
url.workspace = true
# The standalone `WebSocketServer({ port })`: `perry-http-server` is the shared
# HTTP/1.1 server core on turnloop, and this crate is the caller its upgrade
# hook was withheld for. Tokio-free, and small -- `perry-ffi` plus
# `turnloop-http`, both already here.
perry-http-server.workspace = true
# The outbound `wss://` client's TLS, as a host-driven session above the same
# turnloop handle rather than a stack that owns the socket. One copy of the
# state machine, shared with perry-stdlib's fetch/SMTP engines and the CLI.
perry-tls-session.workspace = true
# rustls, its crypto provider (the handshake nonce) and `ClientConfig`, reached
# through the same re-export `perry-tls-session` takes them from, so the two
# cannot disagree about which rustls they mean.
turnloop-tls.workspace = true
lazy_static.workspace = true

[dev-dependencies]
perry-ffi = { workspace = true, features = ["runtime-link"] }
# #6303: perry-runtime MUST be built here with the same feature set the shipped
# `libperry_runtime.a` / `libperry_stdlib.a` carry (i.e. its `default`). This crate
# is a `staticlib`, so it BUNDLES the perry-runtime rlib objects into
# `libperry_ext_*.a` — and perry links the ext archives BEFORE stdlib/runtime
# (`prefer_well_known_before_stdlib`), so those bundled objects WIN the link for
# every symbol they define. The workspace dep is `default-features = false`, so
# without `"default"` here a per-crate `cargo build -p perry-ext-<x>` (exactly what
# release-packages.yml does in its per-crate loop) bundles a runtime with
# `regex-engine`/`temporal`/... compiled OUT. The dispatchers those features gate
# are exported UNCONDITIONALLY (`js_string_replace_search_dyn`,
# `js_native_call_method`, ...) with the feature-gated logic `#[cfg]`-ed out of the
# BODY — so the degraded copy silently ToString-coerces a RegExp argument and
# searches for it literally instead of matching it (str.replace(re, fn) never fires
# its callback). Keep `"default"` in lock-step with perry-runtime's default feature
# list; the `ext_crates_bundle_a_full_featured_perry_runtime` test (well_known.rs) guards it.
# `stdlib` drops the bundled no-op stdlib_stubs (js_stdlib_init_dispatch, ...) so
# they don't shadow perry-stdlib's real symbols when this staticlib is linked
# before stdlib (#6314). `external-ws-symbols` additionally suppresses the ws
# stubs (redundant under `stdlib`, kept to document intent).
perry-runtime = { workspace = true, features = ["default", "external-ws-symbols", "stdlib"] }
