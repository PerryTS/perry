[package]
name = "perry-ext-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native bindings for `@perryts/pdf` (#516) — minimal PDF creation API using the `printpdf` crate. Companion to the existing PdfView widget (which handles the read/render side). v1 surface: createPdf / pdfAddText / pdfAddLine / pdfNewPage / pdfSave."
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
perry-ffi.workspace = true
# Pure-Rust PDF writer. `default-features = false` drops the heavy
# `html` feature (azul-layout, kuchiki, …) — for the v1 surface we
# only need core text + line drawing, which lives in the base crate.
printpdf = { version = "0.10", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# printpdf selects this browser-only bridge transitively. 0.4.79 adds a
# target-gated Tokio dependency, which Cargo resolves into every lockfile even
# when building natively or for WASI. Keep the last Tokio-free release; the
# repository-wide ban must pass before this pin can move.
wasm-bindgen-futures = { version = "=0.4.79", default-features = false }

[dev-dependencies]
perry-ffi = { workspace = true, features = ["runtime-link"] }
