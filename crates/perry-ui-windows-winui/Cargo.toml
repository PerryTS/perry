[package]
name = "perry-ui-windows-winui"
version.workspace = true
edition.workspace = true
license.workspace = true

# Opt-in WinUI 3 (Fluent) Windows backend, selected with
# `--target windows-winui`. Core controls render through Windows Reactor;
# platform services and controls without a Fluent mapping reuse Win32.

[lints]
workspace = true

[lib]
# Same shape as perry-ui-windows: an rlib for Rust consumers and a staticlib
# the perry driver /WHOLEARCHIVE's into the final executable.
crate-type = ["rlib", "staticlib"]

[target.'cfg(target_os = "windows")'.dependencies]
perry-ui-windows = { path = "../perry-ui-windows", default-features = false }
perry-ffi.workspace = true
perry-runtime = { path = "../perry-runtime", default-features = false, features = ["stdlib"] }
base64.workspace = true
libc.workspace = true
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-reactor = { path = "vendor/windows-reactor" }

# The bootstrap probe is dynamically loaded in `src/winui.rs`, allowing a
# missing Windows App SDK runtime to select the existing Win32 implementation.
# Reactor owns the WinUI application lifecycle after that probe succeeds.

[features]
geisterhand = ["perry-ui-windows/geisterhand"]
