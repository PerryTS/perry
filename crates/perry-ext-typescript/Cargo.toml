[package]
name = "perry-ext-typescript"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native TypeScript transpileModule compatibility subset for Perry"

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow.workspace = true
perry-ffi.workspace = true
serde.workspace = true
serde_json.workspace = true
swc_bundler.workspace = true
swc_common.workspace = true
swc_ecma_ast.workspace = true
swc_ecma_codegen.workspace = true
swc_ecma_loader.workspace = true
# Keep the direct parser aligned with Perry's workspace parser. The current
# bundler and transform crates still carry parser 29 transitively; removing
# that second generation requires a coordinated SWC-stack upgrade.
swc_ecma_parser = "32.0"
swc_ecma_transforms_base.workspace = true
swc_ecma_transforms_react.workspace = true
swc_ecma_transforms_typescript.workspace = true
swc_ecma_visit.workspace = true
