[package]
name = "perry-ext-typescript"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native TypeScript transpileModule compatibility subset for Perry"

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow.workspace = true
perry-ffi.workspace = true
serde.workspace = true
serde_json.workspace = true
swc_bundler.workspace = true
swc_common = "26.0"
swc_ecma_ast = "29.0"
swc_ecma_codegen = "32.0"
swc_ecma_loader.workspace = true
# Runtime transpilation and Bun.build use the SWC generation required by
# bundler 56 / loader 27. Their C ABI carries strings and JS values, not SWC
# ASTs; Perry's compiler parser/HIR keep their separately compatible stack.
swc_ecma_parser = "45.1"
swc_ecma_transforms_base = "49.0"
swc_ecma_transforms_react.workspace = true
swc_ecma_transforms_typescript.workspace = true
swc_ecma_visit = "29.0"
