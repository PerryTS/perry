[package]
name = "perry-ext-pg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native bindings for npm `pg` (PostgreSQL client) — uses only `perry-ffi` and `perry-db-turnloop`. Loop-driven: one turnloop socket plus a `turnloop-postgres` sans-I/O core, with the legacy `sqlx` + spawn_blocking bridge kept for clients that decline (no loop, or a Unix-socket host)."

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
perry-ffi.workspace = true
perry-db-turnloop.workspace = true
turnloop-postgres.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { workspace = true }

[dev-dependencies]
perry-ffi = { workspace = true, features = ["runtime-link"] }
# Standalone extension tests need the runtime half of the test-only async FFI
# shims (`perry_ffi_promise_resolve_deferred` lives in perry-stdlib); production
# code still depends on perry-ffi only.
perry-runtime = { workspace = true, features = ["default", "stdlib"] }
