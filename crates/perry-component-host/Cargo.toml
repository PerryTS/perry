[package]
name = "perry-component-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional Component Model host for Perry"

[lib]
crate-type = ["rlib", "staticlib"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
futures-channel = "0.3"
futures-lite = "2"
futures-util.workspace = true
turnloop-tls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
perry-wit = { path = "../perry-wit" }
perry-abi.workspace = true
wasmtime = { version = "48.0.7", default-features = false, features = ["anyhow", "std", "runtime", "cranelift", "component-model", "gc-drc"] }

perry-wasi = { path = "../perry-wasi", features = ["p3"] }

[dev-dependencies]
wat = "1.254"
