[package]
name = "perry-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime library: GC, JSValue, builtins"

# rlib-only (#5422): the staticlib (libperry_runtime.a) is emitted by the
# perry-runtime-static wrapper crate so a plain `cargo build` of the workspace
# no longer produces the heavy archive as a side effect. Build the archive
# explicitly with `cargo build -p perry-runtime-static`.
[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
# Phase A acceptance census and fault hooks. Scalar counts only; compiled out
# of shipped builds. Ext-net's dev dependency enables the binding witnesses.
native-payload-test-census = []
# #10868 measurement: `PERRY_SHAPE_MINT_DIAG`, the per-mint cause /
# key-list-identity / call-site / transition-cache-outcome census.
#
# The feature covers the WHOLE instrument. Every call site is
# `#[cfg(feature = "shape-mint-diag")]`, so a stock build emits none of it and
# `PERRY_SHAPE_MINT_DIAG` measures NOTHING there — not the cache split, not the
# call sites, and not mint volume either. Build with
# `--features perry-runtime/shape-mint-diag` to measure anything at all. The
# module itself always compiles, so its unit tests cannot bit-rot behind a
# feature nobody builds.
#
# It is all-or-nothing on purpose, and the staging measurement is why. Gating
# `#[track_caller]` alone, then the transition-cache probes as well — 1.4 M
# lookups on one `transpileModule`, the probes that LOOK hot — still left
# +0.32 % / +0.35 % on `accd` / `acc`. That residual tracked MINT VOLUME, not
# call frequency: those fixtures mint 3 and 4 ids per object, while `pool` and
# `same` mint almost none and were already at zero. Ranking hooks by how hot
# they look gets this backwards, so every call site is gated rather than
# argued about.
shape-mint-diag = []
# Charter step 5: check at every object trace that each F64 lane holds a
# canonical double (always on in a debug build; this turns it on in release,
# for the gap subset and the tsc/Zod runs).
field-rep-assert = []
# Charter step 3: default-off `PERRY_ATTR_DIAG` census of the attribute
# machinery (where attributes are written, read, and which key-list paths run).
attr-census = []
# Charter step 3: `PERRY_SHAPE_FACT_AUDIT` — check that every object's store
# facts (receiver kind, Array-subclass numeric proof) agree with its shape's
# kind at every stamp AND over the whole live heap at every synchronous full
# collection, and panic on the first disagreement. Also counts how often the
# store-kind transitions run. Off: every hook compiles to nothing.
shape-fact-audit = []
# Test-only, wasm32: run the string-image classifier checks (the same ones the
# unit tests run) at program start inside the linked wasm module, so the
# linker-synthesized `perry_strings` bounds and the real data/stack/heap layout
# are what they classify against. This crate's own test target does not build
# for wasm32. Never part of a shipped archive.
wasm-image-selftest = []

# `default` keeps the shipped prebuilt libperry_runtime.a and plain
# `cargo build`/test full-featured. The auto-optimize path builds with
# `--no-default-features` and re-adds only the features a given program
# actually needs (see optimized_libs.rs), so the heavy subsystems below
# (regex engine, Temporal, URL/IDNA, normalize, segmenter) are *opt-in per
# app* and absent from binaries that never use them.
default = ["full", "regex-engine", "temporal", "url-engine", "intl-namespace", "intl-datetime", "diagnostics", "bun-cli-utils", "dyn-eval", "keepalive-anchors", "alloc-mimalloc", "gc-instruments", "hot-diag"]
# Compile the ~490 `#[used]` keep-alive anchor statics (`KEEP_*`, `keep!`,
# `K*`/`G*` fn-pointer statics) that pin codegen-facing `#[no_mangle]` entry
# points so they survive into the staticlib archive. Without these anchors,
# rustc dead-code-eliminates `#[no_mangle] pub extern "C" fn` symbols that are
# only called from the program's generated object files (not from within the
# perry-runtime crate itself), producing an incomplete `libperry_runtime.a`
# that fails to link with "Undefined symbols" when the codegen emits calls to
# them (e.g. `js_box_release`, `js_bool_box_release`,
# `js_closure_set_box_capture_ptr`, `js_link_path_module_parent`).
#
# In a staticlib archive (`.a`) the linker only pulls in object files that
# resolve an undefined reference, so `#[used]` anchors only become
# `-dead_strip` roots when their object file is pulled in — i.e. when the
# program actually references a symbol from that unit. The size cost is
# therefore limited to the transitive callees of symbols the program uses
# (which would be kept anyway), not the entire runtime surface. Kept in
# `default` so the prebuilt/full archives and `cargo test` are unchanged;
# the auto-optimize rebuild always re-adds it (see optimized_libs.rs).
keepalive-anchors = []
# Route every Rust heap allocation through mimalloc (#62) — ~3-5× faster
# per-alloc than macOS `malloc` on hot paths, at ~140 KB of binary. In
# `default` (and force-added by the auto-optimize rebuild) so behavior is
# unchanged everywhere; a size-optimized rebuild (`PERRY_SIZE_OPT=z|s`)
# leaves it off and falls back to the system allocator. The #6882 VM-tag
# retag rides the same gate (it only exists to label mimalloc's mappings).
alloc-mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

# GC diagnostic instruments (binary size): the heap census (`PERRY_GC_CENSUS`),
# the from-space quarantine (`PERRY_GC_PROTECT_FROMSPACE`), the seeded
# collection schedule (`PERRY_GC_SCHEDULE_SEED`), the from-space scan
# (`PERRY_GC_FROMSPACE_SCAN`), allocation-site sampling
# (`PERRY_ALLOC_SITE_SAMPLE`), and the mark / page-classifier verifiers
# (`PERRY_GC_VERIFY_MARK`, `PERRY_GC_VERIFY_CLASSIFIER`, #10572). ~210 KB that
# no shipped program needs. (`PERRY_GC_VERIFY_EVACUATION` is NOT here: CI
# harnesses set it at run time on binaries compiled without it.) In
# `default`, but the code only compiles when `build.rs` turns the
# `perry_gc_instruments` cfg on: in debug-profile builds (`cargo test`) and in
# the instrumented prebuilt variant (`PERRY_RUNTIME_INSTRUMENTS=1`,
# `scripts/build_instr_runtime.sh`), which perry links instead of the default
# archives when one of those knobs (or `PERRY_GC_INSTRUMENTS=1`) is set at
# compile time. A binary built without it ABORTS at startup when one of the
# knobs is set at run time — an instrument that silently did nothing would
# turn every gate that relies on it green (CLAUDE.md "gate unable to fail").
gc-instruments = []
# wpfacts contract build (`PERRY_CHECK_CONTRACTS=1` at compile time): check
# every dynamic operation against the program's `.perry_facts` claims and
# abort on a contradiction. Never in `default`; release binaries carry none.
# The instrumented prebuilt variant (`PERRY_RUNTIME_INSTRUMENTS=1`) turns the
# checks on without this feature (`perry_contract_checks` cfg in `build.rs`).
contract-checks = []

# Hot-path mutator diagnostics (`hot_diag`, #10572): `PERRY_REGEX_DIAG`,
# `PERRY_IC_DIAG`, `PERRY_LAYOUT_DIAG`, `PERRY_ENUM_DIAG`,
# `PERRY_RECEIVER_REPR_DIAG`. Same contract as `gc-instruments`: in `default`,
# compiled under the `perry_hot_diag` cfg only in debug-profile builds and the
# instrumented prebuilt variant; perry links that variant when one of those
# knobs (or `PERRY_GC_INSTRUMENTS=1`) is set at compile time; a binary built
# without it aborts at startup when one is set at run time. Without it every probe's `*_on()` is a constant `false`, which
# also drops the relaxed load `enum_on()` cost every string concat.
hot-diag = []


# `PERRY_ALLOC_CENSUS` — a sampling profiler for the Rust heap
# (`alloc_census`). OFF by default and compiled out entirely: the census wraps
# the `#[global_allocator]`, and `gc_malloc` runs ~1M times/sec, so even the
# one relaxed load its disabled state costs has no business in a shipped
# build. Enable it to attribute native-heap bytes to call sites; see the
# module docs.
alloc-census = []
# DIAGNOSTIC ONLY — never in `default`, never in a shipping build.
#
# Builds mimalloc in secure + debug mode to hunt heap corruption that is
# *allocator-dependent*: the class of bug that crashes ~56% of the time on
# mimalloc and 0/41 on the system allocator. macOS `free()` ignores the
# caller-passed size, so a mismatched dealloc layout is silently harmless
# there while it corrupts mimalloc's metadata — the system-allocator "fix"
# hides the bug rather than proving its absence.
#
#   secure → guard pages after each block, encoded free lists, randomized
#            placement  ⇒ catches heap *overflow* at the write.
#   debug  → mi_assert checks on every free ⇒ catches invalid free, double
#            free, and wrong-size/align dealloc at the *call site*.
#
# Both report through mimalloc's own error path, so a hit names the failing
# operation instead of leaving a SIGSEGV to attribute by hand. Expect a large
# slowdown; this is an instrument, not a configuration.
alloc-mimalloc-hardened = [
    "alloc-mimalloc",
    "mimalloc/secure",
    "mimalloc/debug",
    "libmimalloc-sys/secure",
    "libmimalloc-sys/debug",
]
# Bun's small data/CLI utility pack (#9600): YAML/TOML parsing, node-semver
# compatible ranges, xxHash64, and zstd decompression. The compiler enables
# this as a unit whenever the `"bun"` module or the opt-in Bun global is used;
# unrelated auto-optimized binaries do not compile or link these backends.
bun-cli-utils = [
    "dep:node-semver",
    "dep:toml",
    "dep:unsafe-libyaml",
    "dep:xxhash-rust",
    "dep:zstd",
]
# Cold-path diagnostic JSON serializers: GC cycle telemetry (`PERRY_GC_DIAG`)
# and the typed-feedback trace dump (`PERRY_TYPED_FEEDBACK`), compiled under
# the `perry_diagnostics` cfg, which `build.rs` turns on only in debug-profile
# builds and in the instrumented prebuilt variant (see `gc-instruments`).
# perry installs the user-facing diagnostics (the v8 heap-snapshot builder,
# `Bun.generateHeapSnapshot`, `process.report`) with
# `js_runtime_install_diagnostics` for a program that references one of them
# (also named `diagnostics` among the install triggers); those are always
# compiled, in every archive. This feature does NOT gate `hot_diag`, which is
# `hot-diag`'s.
diagnostics = []
# Perex is the single compiler and matcher for user regular expressions.
# A program that never evaluates a regex literal, `RegExp`,
# a regex-coercing string method, or a glob API can't produce a RegExp at
# runtime, so the compiler leaves this off and the engine is never linked. The
# RegExp object's identity/display layer (header, `is_regex_pointer`, `toString`)
# stays always compiled, so console-formatting / value-to-string paths keep
# working with no engine present.
regex-engine = ["dep:perex", "dep:smallvec"]
# The TC39 `Temporal.*` API (`temporal_rs` + its transitive tz/calendar deps:
# jiff-tzdb, icu_calendar, timezone_provider, calendrical_calculations —
# ~580 KB). Independent of JS `Date` (which has its own `date.rs` impl), so a
# program that uses `Date` but never `Temporal.*` links none of this. The
# compiler enables it on `Temporal` usage; the Temporal cell's identity layer
# (is_temporal_value / GC class-id range) stays compiled so value
# formatting/JSON/instanceof on non-Temporal values keep working.
temporal = ["dep:temporal_rs"]
# WHATWG URL host canonicalization: the `url` crate's full host parser (IPv4
# shorthand / numeric hosts) + `idna` (Unicode domain ↔ punycode), ~195 KB
# incl. the transitive `percent_encoding`. Perry's URL parsing is otherwise
# hand-rolled (url/parse.rs), so the crates are only reached from 4 host/IDNA
# sites behind URL APIs (`new URL`, hostname setter, url.domainTo*, legacy
# url.resolve). A program that never uses a URL API links none of it; each gated
# site has a benign hand-rolled fallback. (`unicode-normalization`/`-segmentation`
# are NOT gated here — they're shared with Intl / String.normalize.)
url-engine = ["dep:url", "dep:idna"]
# The `Intl.*` NAMESPACE surface (`Intl.NumberFormat`, `DateTimeFormat`,
# `Collator`, `RelativeTimeFormat`, `ListFormat`, `PluralRules`,
# `DisplayNames`, `DurationFormat`, `getCanonicalLocales`,
# `supportedValuesOf`) — ~219 KB of constructor/option/format machinery
# reached ONLY through `install_intl_namespace`, which `populate_global_this
# _builtins` calls unconditionally. Gating the install (a no-op stub when
# off) lets `-dead_strip` drop every part of `intl.rs` not also reachable
# from a locale-aware method entry point. Programs keep working either way:
# `Number/Date/String.prototype.toLocale*` and `localeCompare` live outside
# this gate (their `js_*` entries stay compiled and their helpers stay
# reachable), so only the `Intl.` namespace members depend on it. The
# compiler enables it on any `Intl`/locale-formatting token, erring toward
# enabling (same over-approximation contract as `temporal`).
intl-namespace = ["dep:icu_decimal", "dep:icu_provider"]
# CLDR-accurate Intl.DateTimeFormat / toLocaleString date-time patterns and a
# compiled IANA database for explicit named `timeZone` options.
intl-datetime = ["dep:icu_datetime", "dep:icu_time", "dep:icu_calendar", "dep:timezone_provider", "dep:writeable"]
# `full` only opt-ins the small Node-API helpers (os.hostname / os.homedir).
# `postgres`, `redis`, `whoami` were previously listed here but were either
# unimported (postgres, whoami) or only used by a now-deleted `redis_client.rs`
# whose `js_redis_*` symbols nothing in codegen ever resolved (perry-stdlib's
# ioredis.rs is the live Redis path). Removing them drops ~1.5+ MB from every
# Perry binary that links libperry_runtime.a.
full = ["dep:hostname", "dep:dirs"]
# Exclude perry-runtime's no-op `stdlib_stubs` module (js_stdlib_init_dispatch,
# js_stdlib_process_pending, the fetch/ws/readline no-ops). Enabled by any crate
# that BUNDLES perry-runtime into a staticlib AND is always co-linked with the
# real perry-stdlib: perry-stdlib itself, and every perry-ext-* wrapper (#6314).
# Those wrappers are `crate-type = ["staticlib", ...]`, so `libperry_ext_*.a`
# physically contains a copy of perry-runtime, and perry links the ext archives
# BEFORE stdlib (`prefer_well_known_before_stdlib`) — so the bundled no-op stub
# would win first-definition over perry-stdlib's real symbol (e.g. a node:http
# server's `js_stdlib_init_dispatch` binds to the no-op and never registers the
# tokio reactor). Dropping the whole module from those copies removes the
# shadow. The shipped standalone `libperry_runtime.a` is built WITHOUT this
# feature, so it keeps the stubs and runtime-only builds still link.
# The `ext_crates_bundle_a_full_featured_perry_runtime` test (well_known.rs)
# guards that every runtime-bundling ext crate sets it. NOTE: this is a pure
# symbol-suppression gate; it must NOT be confused
# with the behavioral `external-fetch-symbols` (fetch dispatch routing) below.
stdlib = []
# Extension-crate test binaries that link the real perry-ext-ws symbols still
# need runtime-link for perry-ffi helpers, but must not also export runtime-only
# js_ws_* stubs.
external-ws-symbols = []
# Extension-crate test binaries that link the real perry-ext-fetch symbols need
# runtime-link for perry-ffi helpers, but must not also export runtime-only
# js_fetch_* stubs.
external-fetch-symbols = []
# Enable geisterhand in-process fuzzer (callback registry + dispatch queue)
geisterhand = []
# iOS/tvOS game loop: provides main() that spawns user code on game thread + UIApplicationMain
ios-game-loop = []
# watchOS game loop: provides main() that spawns user code on game thread + WKApplicationMain.
# For Metal/wgpu engines that need to own the draw surface (see crates/perry-runtime/src/watchos_game_loop.rs).
watchos-game-loop = []
# HarmonyOS NAPI entry: provides napi_module_register + a `run` export that
# invokes Perry's compiled `main()`. Auto-enabled by the compiler when
# --target harmonyos[-simulator] is passed (see crates/perry-runtime/src/ohos_napi.rs).
ohos-napi = []
# #6559: runtime dynamic-code evaluation — `new Function(p1, …, body)` with a
# RUNTIME-constructed body parses the generated source with perry-parser (SWC)
# and runs it through a scoped tree-walking interpreter (`src/dyn_eval/`).
# This is what the schema-codegen ecosystem (ajv compiled validators,
# fast-json-stringify serializers, find-my-way router matchers — i.e. every
# fastify app) requires: those libraries have NO non-codegen fallback.
# Pulls the SWC parser tree into libperry_runtime.a, so it is a gated feature:
# default builds carry it; the auto-optimize path enables it only when the
# program contains a deferred dynamic-eval site (the #5206 notice machinery
# already counts them).
dyn-eval = ["dep:perry-parser", "dep:perry-diagnostics", "dep:swc_ecma_visit"]

[dependencies]
# Replacement/search metadata stays inline until it outgrows the operation stack.
smallvec = { version = "1.15", optional = true }
num-bigint = "0.5.1"
num-traits = "0.2"
# #9500: the CJS-default module table (`<mod>.default` <-> base) is shared
# with perry-hir through perry-dispatch, so the runtime's property-read and
# method-call paths and the HIR's import lowering cannot drift apart.
perry-dispatch.workspace = true
# The layout facts generated code bakes in (offsets, TLS slots), shared with
# perry-codegen so the two cannot disagree.
perry-abi.workspace = true
libc.workspace = true
rustc-demangle = "0.1"
# Owned single-phase unwinder (#7302 follow-up): decodes .eh_frame CFI for
# the per-PC step cache. Read-only, no_std-capable subset.
gimli = { version = "0.34", default-features = false, features = ["read"] }
rand = "0.10"
# Wide JSON objects hash untrusted property bytes once into their temporary
# duplicate-key index. aHash keeps that index randomly keyed/DoS-resistant
# without SipHash's serial per-block rounds on this parse hot path.
ahash = "0.8.12"
perex = { workspace = true, optional = true }
# Taffy — flexbox / grid layout engine for the perry/tui module
# (#358 Phase 3). Same crate Bevy and Dioxus use; pure Rust, no FFI.
taffy = { version = "0.13", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
miniz_oxide = "=0.9.1"
itoa.workspace = true
ryu.workspace = true
# ECMAScript shortest-number spelling into a stack buffer (JSON hot path).
# Already present in the workspace lockfile through SWC.
ryu-js = "1.0.3"
# public_imp: `string::provenance::is_utf8` calls the AVX2/SSE4.2 validators
# directly instead of through simdutf8's runtime-selected function pointer.
simdutf8 = { version = "0.1.5", features = ["public_imp"] }
perry-base64.workspace = true
dirs = { workspace = true, optional = true }
# #6559 `dyn-eval`: reuse the compiler's own SWC-based parser for runtime-
# generated `new Function` bodies (no second parser). perry-parser depends
# only on swc + perry-diagnostics — no cycle back into perry-runtime.
perry-parser = { path = "../perry-parser", optional = true }
swc_ecma_visit = { workspace = true, optional = true }
perry-diagnostics = { path = "../perry-diagnostics", optional = true }
node-semver = { version = "2.2.0", optional = true }
toml = { workspace = true, optional = true }
unsafe-libyaml = { version = "0.2.11", optional = true }
xxhash-rust = { version = "0.8.15", features = ["xxh64"], optional = true }
zstd = { workspace = true, optional = true }

# TC39 Temporal API (#4686). Pure-Rust date/time engine (the same one V8
# uses). We write no calendar/duration/timezone math — temporal_rs owns it;
# our code is binding glue per type. `compiled_data` vendors the IANA tz DB
# hermetically (needed by ZonedDateTime / Now), `sys-local` adds the
# current-system-zone lookup used by Temporal.Now.*ISO() with no argument.
# NOTE: NO `sys-local` — that feature resolves the system time zone via
# `iana_time_zone`, which links CoreFoundation on macOS and (because Temporal's
# namespace is always registered) forced `-framework CoreFoundation` into every
# output binary. Perry supplies its own CF-free host system in `temporal::now`
# (clock via `SystemTime`, zone via `crate::date::host_time_zone_name`).
temporal_rs = { version = "0.2.3", default-features = false, features = ["std", "compiled_data"], optional = true }
timezone_provider = { version = "0.2.6", default-features = false, features = ["tzif"], optional = true }

serde.workspace = true
serde_json.workspace = true
# The Node-API host (#8523): addon manifest hashes.
perry-hex.workspace = true
sha2 = "0.11"
# TLS client identity callbacks run from the external net archive, before the
# stdlib TLS module is necessarily linked. Keep the legacy peer-certificate
# object builder in the runtime so that callback path has no stdlib symbol
# dependency (the DER parser is dead-stripped from programs that never use it).
x509-cert = { version = "0.3", default-features = false }
unicode-normalization = { version = "0.1" }
# #4877: extended grapheme-cluster / word / sentence segmentation backing
# Intl.Segmenter (the grapheme path is what string-width@7+/wrap-ansi@9+ use,
# so it gates ink). Pure-Rust UAX #29 implementation, already in our lock graph.
unicode-segmentation = { version = "1" }
# #5298/#5896: BCP-47 (UTS #35) structural locale-tag canonicalization, CLDR
# aliases, and likely-subtag expansion for the Intl locale APIs. Both crates and
# their compiled data are already in the default lock graph via icu_datetime.
icu_locale = { version = "2" }
icu_locale_core = { version = "2" }
# CLDR decimal grouping metadata (primary/secondary group widths and the
# locale's minimum grouping threshold), shared by Intl.NumberFormat and
# Number/BigInt.prototype.toLocaleString.
icu_decimal = { version = "2", default-features = false, features = ["compiled_data"], optional = true }
icu_provider = { version = "2", default-features = false, optional = true }
# CLDR date/time formatting for Intl.DateTimeFormat / Date.prototype.toLocale*
# (icu4x 2.x, matching the icu_calendar/icu_locale_core already in the graph).
# `compiled_data` vendors the CLDR dataset, so byte-for-byte-with-Node locale
# patterns need no runtime data loading. Gated behind `intl-datetime` so only
# programs that actually format localized dates link the data.
icu_datetime = { version = "2", default-features = false, features = ["compiled_data"], optional = true }
icu_time = { version = "2", default-features = false, features = ["compiled_data"], optional = true }
icu_calendar = { version = "2", default-features = false, features = ["compiled_data"], optional = true }
# ICU's semantic field annotations drive Intl.DateTimeFormat#formatToParts.
writeable = { version = "0.6", optional = true }
idna = { version = "1", optional = true }
url = { version = "2", optional = true }
# #4911: real node:dns resolve*/reverse. hickory-proto provides DNS wire-format
# encode/decode + record types; we drive it synchronously over a blocking
# std::net::UdpSocket (TCP fallback on truncation), so — unlike hickory-resolver
# — it pulls NO tokio into the core runtime, matching net.rs's blocking-I/O
# style. dns_config reads only the system nameserver list from /etc/resolv.conf.
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
# #4911/#8515: real node:dgram UDP sockets. socket2 creates sockets so reuse
# and IPv6-only options are applied before bind; std::net::UdpSocket then drives
# send/recv and the common multicast/broadcast/TTL options. SockRef covers the
# remaining multicast-interface and source-specific membership controls.
socket2 = { workspace = true, features = ["all"] }
# mimalloc is declared 64-bit-only below (see the target_pointer_width section) —
# on arm64_32/ILP32 it is neither used nor compiled.

# We'll add GC bindings later
# For now, use a simple bump allocator or leak memory for MVP

# Windows raw-mode for perry/tui input (#406). The Unix path uses
# libc tcsetattr; Windows uses SetConsoleMode via windows-sys.
# `Win32_System_LibraryLoader` powers `perry_plugin_load` / `perry_plugin_unload`
# (`LoadLibraryW` / `GetProcAddress` / `FreeLibrary` — the Win32 equivalents of
# `libc::dlopen` / `dlsym` / `dlclose` that the Unix branch uses).
# Issue #62: mimalloc replaces the system allocator for gc_malloc/arena/etc.
# macOS `malloc` is ~25-40ns/alloc; mimalloc's per-thread free-list is ~5-10ns.
# Set as #[global_allocator] in lib.rs, so it covers Rust heap allocations in
# both the `perry` CLI and the compiled-TypeScript executables linked against
# libperry_runtime.a. 64-bit only: on arm64_32 (ILP32) mimalloc is unproven and
# a corruption suspect, so lib.rs falls back to std::alloc::System there and we
# avoid compiling mimalloc's C on that target entirely.
[target.'cfg(target_pointer_width = "64")'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }
# mimalloc's `extended` C API, needed on EVERY 64-bit target (not just Apple)
# since #9612: the GC's allocator-maintenance step must purge the allocator the
# process actually uses. `malloc_trim` / `malloc_zone_pressure_relief` address
# glibc / the macOS malloc zones, and mimalloc is the `#[global_allocator]`
# here, so those primitives cannot reach the pages a collection just freed.
# `mi_collect` can. The Apple-only VM-tag retag (#6882) uses the same crate.
libmimalloc-sys = { version = "0.1", features = ["extended"], optional = true }

# #6882: mimalloc tags its OS mappings with VM tag 100, which macOS tooling
# (vmmap, Instruments' VM Tracker, `footprint`) decodes as `IOAccelerator` —
# the entire JS heap renders as GPU-driver memory. `js_gc_init` retags to
# VM_MEMORY_APPLICATION_SPECIFIC_1 (240) via mi_option_set(mi_option_os_tag),
# which lives behind libmimalloc-sys's `extended` API. Apple-only: the tag is
# only consulted by Apple kernels. The dependency itself is declared for every
# 64-bit target above; this comment records why the *tag* is Apple-only.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_Foundation",
    # `GetAdaptersAddresses` backs `os.networkInterfaces()` on Windows.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Pipes",
    # `Win32_System_Threading` powers the Windows arm of `process.kill`
    # (`OpenProcess` / `TerminateProcess` / `GetExitCodeProcess`, mirroring
    # libuv's `uv_kill`) in `src/os/signal.rs`.
    "Win32_System_Threading",
    # The shape-record reservation (`object/shapes_store/flat.rs`).
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

# #855: libc::mach_host_self is deprecated; the mach2 crate is the
# upstream-recommended replacement. Pulled in only where we actually
# call host_statistics64 (`js_os_freemem` on macOS / iOS). Need 0.6+
# because earlier mach2 releases didn't surface mach_host_self.
# Every Apple platform, not just macOS/iOS: the GC's Mach-O stack-map discovery
# (`gc/roots/stack_maps.rs`) uses `_dyld_get_image_header` on tvOS and visionOS
# too, and gating the dependency more narrowly than the code silently drops
# those targets into the no-section stub — i.e. a collector with no roots.
[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = "0.6"

# build.rs auto-generates no-op `perry_ui_*` FFI stubs for the harmonyos
# build (cfg(feature = "ohos-napi")) by reading the dispatch tables here.
# See `build.rs` and issue #395 for the rationale.
[build-dependencies]
perry-abi.workspace = true
perry-dispatch = { path = "../perry-dispatch" }
# The stub list and the Node-API host export inventory, shared with the
# compiler (which must not link this crate).
perry-runtime-manifest = { path = "../perry-runtime-manifest" }
# Build-time only: compiles the 20-line setjmp trampoline
# (src/ffi/perry_sjlj.c) that the exception transport routes every
# jmp_buf arm through — rustc cannot express `returns_twice` (#9305).
cc = "1"
# Build-time only: fingerprints the compiler/runtime source contract embedded
# in libperry_runtime so the CLI can reject a stale archive before linking.
sha2 = "0.11"
# Build-time only (does NOT ship in the runtime binary): generates the WHATWG
# single-byte TextDecoder index tables so they are always spec-accurate. Only
# the generated `[u16; 128]` arrays land in the binary. Already vetted in the
# workspace lock (allsorts / lopdf depend on it).
encoding_rs = "0.8"

# #9591: OS change notifications behind `fs.watch` / `fsPromises.watch`
# (inotify / ReadDirectoryChangesW / kqueue), replacing the timer-driven full
# tree walk. See `fs/dir_glob_watch/watch_backend.rs`. NOT on macOS: notify's
# FSEvents backend needs `-framework CoreServices` on every link line that
# retains the watcher (every `fs` importer), which perry keeps off console
# binaries for launch time; `watch_fsevents.rs` binds FSEvents via dlopen.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify.workspace = true

# turnloop P0 (docs/turnloop/p0-report.md): each native JS agent's event-loop
# wait driver (`event_pump/agent_loop.rs`). Native blocking hosts only; the web
# and WASI targets keep their existing host integration until their backends
# are wired per agent (P3/P4).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
turnloop.workspace = true
perry-component-io.workspace = true

# `os.hostname()` under `full`. WASI has no hostname (the crate refuses the
# target), so `js_os_hostname` answers "localhost" there (#11377).
[target.'cfg(not(target_os = "wasi"))'.dependencies]
hostname = { version = "0.4", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# Constructor-based enumeration of relocated image records in linear memory.
inventory = "=0.3.21"
