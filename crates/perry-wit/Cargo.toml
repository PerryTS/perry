[package]
name = "perry-wit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WIT contracts and TypeScript bindings for Perry components"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wit-parser = "0.254.0"
wit-bindgen-c = "=0.60.0"
wit-bindgen-core = "=0.60.0"
heck = "0.5"
wac-graph = { version = "=0.12.0", path = "../../third_party/wac-graph" }
wasm-encoder = { version = "=0.258.3", features = ["wasmparser"] }
wasmparser = "=0.258.3"

[dev-dependencies]
tempfile = "3"
wit-component = "0.254.0"
wat = "1.254"
