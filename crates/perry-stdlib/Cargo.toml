[package]
name = "perry-stdlib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standard library implementations: fs, http, crypto, mysql, postgres"

# rlib-only (#5422): the staticlib (libperry_stdlib.a) is emitted by the
# perry-stdlib-static wrapper crate so a plain `cargo build` of the workspace
# no longer produces the heavy archive as a side effect. Build the archive
# explicitly with `cargo build -p perry-stdlib-static`.
[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
# Default: include everything for backwards compatibility
default = ["full"]

# Full stdlib - every self-contained implementation. External pump features
# must stay out of this list: release archives enable `full` without linking
# their per-program provider archives, and adding an external HTTP pump here
# made HTTP-free Linux UI links require libperry_ext_http.a (#5983, #8587).
full = ["http-server", "http-client", "database", "crypto", "compression", "email", "websocket", "image", "scheduler", "ids", "html-parser", "net", "tls", "bundled-events", "bundled-decimal", "bundled-streams", "turnloop-smtp-client"]

# Minimal core - just what's needed for basic programs
core = []

# EventEmitter — pure Rust, no extra deps. Default-on through `full`.
bundled-events = []

# decimal.js / bignumber.js — needs `rust_decimal`. Default-on
# through `full`.
bundled-decimal = ["dep:rust_decimal"]

# HTTP server (the native framework's own server)
# Note: dashmap is now always-on (used by core handle registry), no longer listed here.
# Gates the `framework` module only. The npm `fastify` binding was removed
# (#466); `import 'fastify'` now compiles the real npm package from source.
#
# turnloop: this used to be `dep:hyper` + `dep:hyper-util` + an `async-runtime`
# (tokio) requirement, for a hyper service in `framework/server.rs`. It is
# `perry-http-server` now — the shared HTTP/1.1 core on turnloop — and the
# module needs no async runtime at all, so `async-runtime` is gone from this
# gate too. The framework module is in `full`, so those were edges every
# default build of perry-stdlib carried.
http-server = ["dep:perry-http-server", "dep:http-body-util", "dep:bytes"]

# Web Fetch compatibility surface. The well-known flip can strip this
# when the external binding owns the imported surface.
# `bundled-streams` rides under the umbrella for backwards-compat
# with v0.5.571's `--features http-client` callers (which got
# `pub mod streams` transitively). The well-known flip strips
# `bundled-streams` directly, and also strips `http-client` when
# node-fetch / http / https is imported through the well-known
# table — both ends move in lockstep.
#
# #5174: `http-client` decomposes into `web-fetch` (the Web Fetch API).
# Node HTTP is provided only by perry-ext-http.
turnloop-http-client = ["dep:turnloop-http", "dep:turnloop-tls", "dep:perry-tls-session", "dep:url", "dep:http"]
web-fetch = ["dep:reqwest", "async-runtime", "bundled-streams", "turnloop-http-client"]
http-client = ["web-fetch"]

# Web Streams API (issue #237). Per-binding gate v0.5.572 — the
# well-known flip routes `import 'streams'` to perry-ext-streams
# by stripping this feature. Default-on through `default = ["full"]`
# and through the `http-client` umbrella for legacy callers.
bundled-streams = ["dep:flate2", "dep:brotli"]

# WebSocket — `websocket` umbrella retained for backwards-compat;
# v0.5.571's well-known flip toggles `bundled-ws` instead so
# `import 'ws'` can route to perry-ext-ws without duplicate
# `_js_ws_*` symbols at link time.
websocket = ["bundled-ws"]
# turnloop WS lane: the codec is `turnloop-websocket`'s sans-I/O protocol core,
# with `turnloop-http` supplying the HTTP/1 head codec the opening handshake is
# expressed in, driven over the tokio streams `ws.rs` already owned. It
# replaced the old `WebSocketStream<S>` wrapper, which welded the codec to the
# transport. `dep:url` parses the connect target; `dep:tokio-rustls` +
# `dep:rustls-native-certs` are the outbound `wss://` client — both were
# already declared for `tls-runtime`, so no new third-party crate enters the
# graph. perry-stdlib must NOT depend on perry-ext-ws: it is the bundled
# alternative to that crate, so the duplication between the two `ws` bindings
# is deliberate.
# #6117: `dep:rustls` so the client-connect path can install a process-level
# CryptoProvider before the first `wss://` handshake — feature unification
# enables BOTH `ring` and `aws-lc-rs` in the final link, so rustls panics
# unless one is installed explicitly (same as the `tls` feature's paths).
bundled-ws = ["dep:turnloop-websocket", "dep:turnloop-http", "dep:url", "dep:tokio-rustls", "dep:rustls", "dep:rustls-native-certs", "async-runtime"]

# Activated by `optimized_libs::build_optimized_libs` when the
# well-known flip strips `bundled-ws` and routes `import 'ws'` to
# perry-ext-ws. Retains the shared async runtime needed by that extension;
# the extension registers its pump and keepalive contributor directly with
# perry-runtime (#9696).
external-ws-pump = ["async-runtime"]

# Raw TCP sockets (`net.Socket` — Postgres wire driver, custom protocols).
# `net` umbrella retained for backwards-compat; v0.5.571's
# well-known flip toggles `bundled-net` instead so `import 'net'`
# can route to perry-ext-net.
net = ["bundled-net"]
bundled-net = ["async-runtime"]

# Activated by `optimized_libs::build_optimized_libs` (v0.5.579) when
# the well-known flip strips `bundled-net` and routes `import 'net'`
# to perry-ext-net. Selects ext-net dispatch adapters and the shared async
# runtime. The extension itself registers its pump and keepalive contributor.
external-net-pump = ["async-runtime"]

# Activated by `optimized_libs::build_optimized_libs` (#1843) when the
# well-known flip routes `node:zlib` to perry-ext-zlib and strips
# `compression`. Routes lost-static-type `gz.write()` / `.on()` /
# `.pipe()` calls through `js_ext_zlib_dispatch_method`. It also registers
# `js_ext_zlib_native_dispatch` for captured module exports such as
# `util.promisify(zlib.gzip)`; pump and keepalive registration is owned by
# perry-ext-zlib.
external-zlib-pump = ["async-runtime"]

# Activated by `optimized_libs::build_optimized_libs` (v0.5.714) when
# the well-known flip routes `node:http` / `node:https` / `node:http2`
# to perry-ext-http. Selects the HTTP server dispatch adapters and shared async
# runtime; perry-ext-http registers its pump and keepalive contributor.
external-http-server-pump = ["async-runtime"]

# Activated by `optimized_libs::build_optimized_libs` when the well-known
# flip routes `node:http` / `node:https` to perry-ext-http and the user
# code calls `http.request` / `http.get`. Selects client dispatch adapters
# and the shared async runtime; perry-ext-http registers its own callbacks.
external-http-client-pump = ["async-runtime"]

# Activated by `optimized_libs::build_optimized_libs` when the well-known
# flip routes `node:events` to perry-ext-events. Makes
# `js_stdlib_init_dispatch` register perry-ext-events'
# `js_event_emitter_new_with_options` as the runtime's events construct
# dispatcher at startup, so a dynamic `new` on the bound
# `events.EventEmitter` export value (`require('events')`, default import,
# aliased ctor) builds a real emitter instead of an empty object. Without
# this, ext-events only registers its hooks lazily on the first *static*
# emitter construction. Issue #4995.
external-events-construct = []

# TLS — direct `tls.connect()` and `socket.upgradeToTLS()` (Postgres SSLRequest flow).
# Uses rustls (not native-tls) to avoid OpenSSL on every platform and keep Android
# cross-compile unblocked; matches the reqwest/mongodb feature flags.
#
# `tls-runtime` contains the shared TLS server/preflight implementation. The
# `external-net-tls` adapter uses that implementation while resolving
# `js_tls_connect` from perry-ext-net; compiling bundled net beside the wrapper
# would reintroduce duplicate `js_net_*` / `js_tls_connect` symbols. The public
# `tls` umbrella retains its historical bundled-net behavior.
tls = ["bundled-net", "tls-runtime"]
external-net-tls = ["tls-runtime"]
tls-runtime = [
    "async-runtime",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pemfile",
    "dep:base64",
    "dep:x509-cert",
]

# Retains the TLS module/server and TLSSocket dispatch surface when `node:tls`
# is routed to perry-ext-net. Unlike `tls`, this must not pull bundled-net back
# in because the wrapper owns client sockets and their event pump.
external-tls-server = [
    "async-runtime",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pemfile",
    "dep:base64",
    "dep:x509-cert",
]

# Databases
#
# turnloop P8 group H: the bundled `pg` / `mysql2` / `ioredis` / `mongodb`
# copies are GONE. They were the pre-#466 in-stdlib implementations, kept as
# the fallback the well-known flip declined to. Every `extern "C"` symbol they
# defined is also defined — and strictly extended — by perry-ext-pg /
# perry-ext-mysql2 / perry-ext-ioredis / perry-ext-mongodb, which is the only
# path the flip has routed those imports down since v0.5.565-568. Keeping them
# cost perry-stdlib a `sqlx` + `redis` + `mongodb` manifest edge, and 76 of the
# 502 packages in this crate's own dependency closure (502 -> 426), for code no
# default compile reached. Cargo.lock itself does NOT shrink: perry-ext-pg /
# -mysql2 / -ioredis / -mongodb keep the same drivers. `database-sqlite` is
# NOT in that set: rusqlite is not a tokio dependency and `dispatch_sqlite_stmt`
# is deliberately retained through the flip (Refs #643).
database = ["database-sqlite"]
database-sqlite = ["dep:rusqlite"]

# Crypto (sha256, md5, bcrypt, jwt, etc.)
# Implies `async-runtime` because bcrypt/jwt/argon2 hashing offloads to
# `tokio::task::spawn_blocking`, and `ids` because `crypto.randomUUID()`
# delegates to the `uuid` crate.
# `crypto` stays as the umbrella for backwards-compat; `bundled-bcrypt`
# and `bundled-argon2` (v0.5.537) split out the two password-hashing
# bindings so the well-known flip (#466 Phase 4 step 2) can route them
# to perry-ext-bcrypt / perry-ext-argon2 without taking the rest of
# the crypto surface offline.
crypto = ["dep:sha2", "dep:sha1", "dep:sha3", "dep:shake", "dep:sha3_010", "dep:sha3-utils", "dep:rsa-sha1", "dep:md-5", "dep:hex", "dep:hmac", "dep:aes", "dep:aes_09", "dep:cbc", "dep:ecb", "dep:ctr", "dep:scrypt", "dep:pbkdf2", "dep:base64", "dep:x25519-dalek", "dep:x448", "dep:ed25519-dalek", "dep:ed448-goldilocks", "dep:aes-gcm", "dep:chacha20poly1305", "dep:ghash", "dep:aes-kw", "dep:hkdf", "dep:p256", "dep:p384", "dep:p521", "dep:rsa", "dep:spki", "dep:x509-cert", "dep:ml-kem", "async-runtime", "ids", "bundled-bcrypt", "bundled-argon2", "bundled-ethers"]
bundled-bcrypt = ["dep:bcrypt", "async-runtime"]
bundled-argon2 = ["dep:argon2", "async-runtime"]
# ethers blockchain utilities — pure Rust, no extra deps. Default-on
# through `crypto` umbrella; the well-known flip strips this and
# routes to perry-ext-ethers when `import 'ethers'` is detected.
bundled-ethers = []

# Compression (node:zlib) — per-codec split (stdlib cherry-pick).
# `compression-gzip` is the base codec family (gzip/deflate/inflate/
# unzip/crc32 via flate2) and gates `pub mod zlib` itself; the Brotli
# and zstd codecs layer on top and imply it (the zlib module's stream
# framework, options validation and pump are shared). The auto-optimize
# feature computation maps `import 'node:zlib'` to `compression-gzip`
# and adds `compression-brotli` / `compression-zstd` only when the HIR
# references a Brotli / zstd API token (see
# `collect_modules/feature_detect.rs`), falling back to the full
# umbrella when deferred dynamic code could call codecs by runtime
# strings. The `compression` umbrella stays as the union for
# backwards compatibility (`--features compression` and the default
# `full` build are byte-identical to the pre-split archive).
# `async-runtime` is explicit here (not inherited): zlib's deferred
# stream/one-shot events are queued through `common::async_bridge`'s
# pump, which only compiles under `async-runtime`. Historically the
# auto-optimize path always enabled it transitively (the force-added
# `crypto` feature implied it), so `--features compression` never
# compiled standalone — now it does.
compression-gzip = ["dep:flate2", "async-runtime"]
compression-brotli = ["compression-gzip", "dep:brotli"]
compression-zstd = ["compression-gzip", "dep:zstd"]
compression = ["compression-gzip", "compression-brotli", "compression-zstd"]

# Email (nodemailer) — `email` umbrella retained for
# backwards-compat; v0.5.558's well-known flip toggles
# `bundled-nodemailer` instead.
email = ["bundled-nodemailer"]
# `async-runtime` stays: the surrounding binding still builds its promises
# through `common::async_bridge`. The transport itself takes no tokio thread.
bundled-nodemailer = ["async-runtime", "turnloop-smtp-client"]
# turnloop P6: SMTP on turnloop (`src/turnloop_smtp/`). Kept OUT of the
# `bundled-nodemailer` gate's strip path — it rides in `full` on its own so
# the `js_smtp_*` entry points survive the well-known flip that strips
# `bundled-nodemailer`, and perry-ext-nodemailer can reach them.
turnloop-smtp-client = ["dep:turnloop-smtp", "dep:turnloop-tls", "dep:perry-tls-session", "dep:url"]

# Image processing (sharp) — `image` umbrella stays for
# backwards-compat; v0.5.551's well-known flip toggles
# `bundled-sharp` instead.
image = ["bundled-sharp"]
bundled-sharp = ["dep:image"]

# HTML parsing (cheerio) — `html-parser` umbrella stays for
# backwards-compat; v0.5.550's well-known flip toggles
# `bundled-cheerio` instead.
html-parser = ["bundled-cheerio"]
bundled-cheerio = ["dep:scraper"]

# Scheduler (cron) — the `cron` native binding was removed (real npm
# `cron` source now compiles via `perry.compilePackages`). `scheduler`
# stays as an empty umbrella, same as `ids`, for backwards compat only.
scheduler = []


# `ids` is now an empty umbrella kept only for backwards compat:
# both members are gone — `bundled-uuid` with the uuid binding
# (#10701) and `bundled-nanoid` with the nanoid binding (#10693).
# Real `uuid` / `nanoid` now compile from npm source, so nothing
# needs to be toggled here; enabling `ids` is a harmless no-op.
ids = []

# Async runtime (tokio) - internal feature
async-runtime = ["dep:tokio"]

# OCI container subsystem (perry/container, perry/compose, perry/workloads).
# Pulls in perry-container-compose and exposes the `js_container_*` and
# `js_compose_*` FFI exports that the codegen dispatch table targets.
container = ["dep:perry-container-compose", "async-runtime"]

[dependencies]
perry-ffi.workspace = true
perry-runtime = { workspace = true, features = ["stdlib"] }
# Re-bundle updater symbols into libperry_stdlib.a so user binaries that
# call `perry/updater` resolve at link time without extra wiring.
perry-updater = { workspace = true }
# Container subsystem (gated behind the `container` feature). The stdlib
# container/ module re-exports `perry_container_compose::*` types and
# delegates orchestration to `ComposeEngine` / `ContainerBackend`.
#
# NOTE 1: this is a DIRECT path dep (not `workspace = true`) so the
# build doesn't break if the `[workspace.dependencies]
# perry-container-compose` line gets stripped. The `[workspace] members`
# entry is still required for `cargo build -p perry-container-compose`
# to succeed — that's enforced by the `crate_in_workspace_members` test
# in this crate's tests/.
perry-container-compose = { path = "../perry-container-compose", optional = true }

# Always needed
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
once_cell.workspace = true
# turnloop P6 — the outbound client engines. Optional: a build without
# `web-fetch` / `turnloop-smtp-client` links neither.
turnloop-http = { workspace = true, optional = true }
turnloop-tls = { workspace = true, optional = true }
# P11: the extracted TLS client session (one copy, shared with the CLI's
# blocking HTTP client). Follows turnloop-tls's optionality exactly.
perry-tls-session = { workspace = true, optional = true }
turnloop-smtp = { workspace = true, optional = true }
# `turnloop_http::client::Request` exposes a `url::Url`, and the canonical
# reason phrase `Response.statusText` reports comes from `http::StatusCode`
# — the same crate reqwest already puts in this graph.
url = { workspace = true, optional = true }
http = { workspace = true, optional = true }
lazy_static.workspace = true
chrono = { workspace = true, features = ["serde"] }
rand = "0.10"  # Required by lodash (core module)
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }

# === OPTIONAL DEPENDENCIES ===

# Async runtime
tokio = { version = "1", features = ["full"], optional = true }

# HTTP Server
perry-http-server = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# DashMap is used by the always-on handle registry (`common/handle.rs`),
# so it must NOT be optional — every minimal-stdlib build needs it.
dashmap.workspace = true

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "http2"], default-features = false, optional = true }

# WebSocket — the sans-I/O protocol core the `ws` module's codec is built on.
# `turnloop-http` is declared with the other turnloop client engines above.
turnloop-websocket = { workspace = true, optional = true }
# TLS (for net.Socket.upgradeToTLS and tls.connect) — rustls-only, no OpenSSL.
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pemfile = { workspace = true, optional = true }

# Database
#
# No sqlx / redis / mongodb / bson here any more (turnloop P8 group H): the
# bundled copies that needed them were deleted, and the perry-ext-* wrappers
# carry their own edges. rusqlite stays — it is not a tokio driver.
rusqlite = { version = "0.39", features = ["bundled", "column_decltype", "limits", "session"], optional = true }

# Crypto
sha2 = { version = "0.11", optional = true }
sha1 = { version = "0.11", optional = true }
sha3 = { version = "0.12", optional = true }
# SHAKE128/256 moved out of `sha3`'s root into this crate as of sha3 0.12.
shake = { version = "0.1", optional = true }
sha3_010 = { package = "sha3", version = "0.10", optional = true, default-features = false }
sha3-utils = { version = "0.5", optional = true }
rsa-sha1 = { package = "sha1", version = "0.10", optional = true }
md-5 = { version = "0.11", optional = true }
hex = { workspace = true, optional = true }
hmac = { version = "0.13", optional = true }
bcrypt = { version = "0.19", optional = true }
p256 = { version = "0.13", optional = true, default-features = false, features = ["pkcs8", "pem", "ecdsa", "ecdh"] }
p384 = { version = "0.13", optional = true, default-features = false, features = ["pkcs8", "pem", "ecdsa", "ecdh"] }
p521 = { version = "0.13", optional = true, default-features = false, features = ["pkcs8", "pem", "ecdsa", "ecdh"] }
rsa = { version = "0.9", optional = true, default-features = false, features = ["pem", "pkcs5", "sha2"] }
# #1367 node:crypto X509Certificate — DER/PEM cert parsing. x509-cert 0.3 and
# the direct dependency use DER/SPKI 0.8; jsonwebtoken's current RSA and
# elliptic-curve dependencies retain their transitive SPKI 0.7 stack.
x509-cert = { version = "0.3", optional = true, default-features = false, features = ["pem"] }
spki = { version = "0.8", optional = true, default-features = false, features = ["pem", "alloc"] }
aes = { version = "0.8", optional = true }
aes_09 = { package = "aes", version = "0.9", optional = true }
cbc = { version = "0.2", optional = true }
ecb = { version = "0.2", optional = true }
ctr = { version = "0.9", optional = true }
scrypt = { version = "0.11", optional = true }
pbkdf2 = { version = "0.13", features = ["hmac"], optional = true }
argon2 = { version = "0.5", optional = true }
base64 = { workspace = true, optional = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"], optional = true }
x448 = { version = "0.14.0-pre.9", features = ["static_secrets"], optional = true }
ed25519-dalek = { version = "2.1", optional = true }
ed448-goldilocks = { version = "0.14.0-pre.13", default-features = false, features = ["alloc", "signing"], optional = true }
aes-gcm = { version = "0.10", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
ghash = { version = "0.6", optional = true }
# AES-KW (RFC 3394) — used by `crypto.subtle.wrapKey` / `unwrapKey`
# when the wrap algorithm is `{ name: 'AES-KW' }`. Gated under the
# `crypto` umbrella so it tracks the rest of the symmetric surface.
aes-kw = { version = "0.3.0", optional = true }
hkdf = { version = "0.13", optional = true }
ml-kem = { version = "0.3.2", features = ["pkcs8"], optional = true }

# Compression
flate2 = { version = "1.0", optional = true }
# Brotli decompression — feature-checked by axios at module init.
brotli = { version = "8.0.2", optional = true }
# Zstd codecs — exposed by modern Node alongside gzip/deflate/Brotli.
zstd = { version = "0.13.3", optional = true }

# Email: no direct lettre edge. The MIME builder comes through
# `turnloop_smtp::message`, which re-exports lettre's `Message` and
# `message::header` from a dependency pinned to lettre's `builder` feature.
# Declaring lettre here instead would drag `tokio1` / `tokio1-rustls-tls` /
# `pool` back in, which is the whole tokio edge this crate's mail surface had.

# Image
image = { version = "0.25", optional = true }

# HTML parser
scraper = { version = "0.27", optional = true }

# Scheduler

# Rate limiting

# Validation

# IDs
# Required unconditionally by crypto/random.rs (crypto.randomUUID /
# randomUUID({ v7: true })), which has no feature gate of its own —
# never optional, regardless of the bundled-uuid npm-binding feature
# (removed; see #10678/#466).
uuid = { version = "1.23", features = ["v4", "v1", "v3", "v5", "v7"] }

# Decimal math (Big.js / Decimal.js) — optional from v0.5.547 so
# the well-known flip can strip perry-stdlib's copy when
# `import 'decimal.js'` resolves to perry-ext-decimal instead.
rust_decimal = { version = "1.33", features = ["maths"], optional = true }

# libc — termios for readline's raw-mode toggle (#347 Phase 2). The
# Unix path uses tcsetattr/cfmakeraw; Windows uses SetConsoleMode via
# the windows-sys crate (#406). iOS/Android stdlibs are stubbed
# entirely (no terminal surface on those platforms).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_Foundation",
] }

[dev-dependencies]
# Property tests for the container FFI bridge (gated behind `container` feature
# at the test-file level via `#[cfg(feature = "container")]`).
proptest = "1"
serde_yaml = "0.9"
