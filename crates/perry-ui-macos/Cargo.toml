[package]
name = "perry-ui-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
plugins = []
geisterhand = []

[target.'cfg(target_os = "macos")'.dependencies]
perry-ffi.workspace = true
perry-ui = { path = "../perry-ui" }
perry-ui-testkit = { workspace = true }
perry-base64.workspace = true
block2 = "0.6"
libc.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSThread",
    "NSRunLoop",
    "NSGeometry",
] }
objc2-core-foundation = { version = "0.3", features = [
    "CFCGTypes",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSButton",
    "NSTextField",
    "NSTextFieldCell",
    "NSActionCell",
    "NSCell",
    "NSStackView",
    "NSControl",
    "NSText",
    "NSRunningApplication",
    "NSResponder",
    "NSLayoutConstraint",
    "NSUserInterfaceLayout",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSBox",
    "NSSwitch",
    "NSSlider",
    "NSScrollView",
    "NSClipView",
    "NSPasteboard",
    "NSColor",
    "NSFont",
    "NSFontManager",
    "NSSavePanel",
    "NSOpenPanel",
    "NSSecureTextField",
    "NSProgressIndicator",
    "NSPopUpButton",
    "NSImage",
    "NSImageView",
    # System tray icon (issue #490)
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
perry-runtime.workspace = true

[[test]]
name = "native_widget_order"
path = "tests/native_widget_order.rs"
harness = false

[[test]]
name = "native_widget_padding"
path = "tests/native_widget_padding.rs"
harness = false

[[test]]
name = "native_button_font_family"
path = "tests/native_button_font_family.rs"
harness = false

[[test]]
name = "native_widget_max_width"
path = "tests/native_widget_max_width.rs"
harness = false

[[test]]
name = "native_text_color"
path = "tests/native_text_color.rs"
harness = false

[[test]]
name = "native_button_image_size"
path = "tests/native_button_image_size.rs"
harness = false

[[test]]
name = "native_textfield_selection"
path = "tests/native_textfield_selection.rs"
harness = false

[[test]]
name = "native_text_spacing"
path = "tests/native_text_spacing.rs"
harness = false

[[test]]
name = "native_window_appearance"
path = "tests/native_window_appearance.rs"
harness = false
