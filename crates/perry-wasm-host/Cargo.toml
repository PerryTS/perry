[package]
name = "perry-wasm-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly host runtime for Perry (wasmi engine, isolated so the default build does not pull wasmi)"

[lints]
workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
# The entry-point table shared with perry-runtime (`perry_abi::wasm_host`).
perry-abi.workspace = true
# wasmi: pure-Rust WebAssembly interpreter. Default-features off so we don't pull
# the std-only "string-interner" extras that bloat binary size — the issue
# measured ~1.1 MB delta with default-features=false.
# `simd`: real-world wasm payloads are built with SIMD on (e.g. Rust's
# wasm32 target with `+simd128`); without it `new WebAssembly.Module`
# rejects them at instantiation with "unexpected SIMD opcode: 0xfd".
wasmi = { version = "1.1", default-features = false, features = ["simd"] }

# Keep the interpreter and syscall engine independent: no Wasmtime compiler.
wasi-common = { version = "36.0.12", default-features = false, features = ["sync"] }
wiggle = { version = "36.0.12", default-features = false }
cap-std = "3.4.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
wat = "1"
tempfile = "3"

[features]
default = []
