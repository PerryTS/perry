[package]
name = "perry-ext-axios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native bindings for the npm `axios` HTTP client — uses only `perry-ffi`. First HTTP-client port (Phase 5 step 13)."

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
perry-ffi.workspace = true
# turnloop P11 (docs/turnloop/p11-report.md): reqwest and tokio are gone. Each
# request already ran inside `perry_ffi::spawn_blocking` and then blocked that
# pool thread on `Handle::current().block_on`; `perry_http_client` blocks the
# same thread on a `turnloop::Loop` it owns instead. That also fixes #10326 —
# the old code built a fresh ~250 KB `reqwest::Client`, with its own cold DNS
# and TLS caches, on EVERY call.
perry-http-client.workspace = true

[dev-dependencies]
perry-ffi = { workspace = true, features = ["runtime-link"] }
