[package]
name = "perry-gc-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Archive-derived runtime GC and unwind effects"

[lints]
workspace = true

[[bin]]
name = "perry-gc-effects"
path = "src/main.rs"
required-features = ["analyzer"]

[[example]]
name = "inspect"
required-features = ["analyzer"]

[[example]]
name = "profile"
required-features = ["analyzer"]

# The analyzer (archive reader, call graph, rules) is the default. Without it
# the crate is the sidecar format alone: the key, the table rows and their
# parser, which perry reads at compile time (perry never links the analyzer).
[features]
default = ["analyzer"]
analyzer = [
    "dep:clap",
    "dep:perry-abi",
    "dep:object",
    "dep:rustc-demangle",
    "dep:perry-perex",
    "dep:regex",
    "dep:walkdir",
    "dep:llvm-sys",
    "dep:serde",
    "dep:serde_json",
    "dep:perry-runtime-manifest",
]

[dependencies]
anyhow.workspace = true
perry-abi = { workspace = true, optional = true }
sha2 = "0.11"
clap = { workspace = true, optional = true }
object = { version = "0.37", default-features = false, features = ["read", "std"], optional = true }
rustc-demangle = { version = "0.1", optional = true }
perry-perex = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
# Effect declarations of realm natives (the `effects` check).
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
perry-runtime-manifest = { workspace = true, optional = true }

[target.'cfg(not(windows))'.dependencies]
llvm-sys = { version = "231", optional = true }

[target.'cfg(windows)'.dependencies]
llvm-sys = { version = "221", features = ["no-llvm-linking"], optional = true }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
