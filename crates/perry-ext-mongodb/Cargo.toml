[package]
name = "perry-ext-mongodb"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native bindings for npm `mongodb` — uses only `perry-ffi`. Async via the mongodb crate bridged through spawn_blocking + JsPromise + tokio::Handle::current().block_on."

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
perry-ffi.workspace = true
perry-db-turnloop.workspace = true
turnloop-mongodb.workspace = true
mongodb = { version = "3.7", default-features = false, features = ["bson-3", "compat-3-3-0", "rustls-tls", "dns-resolver"] }
bson = { version = "3.1", features = ["serde"] }
tokio = { workspace = true }
futures-util = "0.3"
serde_json.workspace = true

[dev-dependencies]
perry-ffi = { workspace = true, features = ["runtime-link"] }
# Standalone extension tests need the runtime half of the test-only async FFI
# shims (`perry_ffi_promise_resolve_deferred` lives in perry-stdlib, which a
# `cargo test -p perry-ext-mongodb` binary does not link); production code
# still depends on perry-ffi only. Same dev-dependency perry-ext-ioredis has.
perry-runtime = { workspace = true, features = ["default", "stdlib"] }
