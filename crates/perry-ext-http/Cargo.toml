[package]
name = "perry-ext-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native bindings for Node's `http` / `https` modules — callback-style ClientRequest / IncomingMessage over turnloop, with TLS via perry-tls-session."

[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
perry-ffi.workspace = true
# Attached `WebSocketServer({ server })` and WebSocket upgrades.
perry-ext-ws.workspace = true
perry-ext-net.workspace = true
# P5: the sans-I/O HTTP/1.1 codec that replaces hyper's parser and framer on
# the turnloop server path (`server/turnloop_serve`). Default features only —
# see that module's header for why `turnloop_http::asynchronous` is not used.
turnloop-http.workspace = true
http = "1"
rustls = { workspace = true, features = ["std", "ring", "tls12"] }
rustls_webpki = { package = "rustls-webpki", version = "0.103" }
rustls-pemfile.workspace = true
tokio = { workspace = true }
# The client transport (`client_turnloop`): the rustls session that runs
# `https:` above a turnloop socket, and the URL type requests are parsed into.
perry-tls-session.workspace = true
url.workspace = true
# Response body chunks travel through the streaming event enum as refcounted
# `Bytes`.
bytes.workspace = true
serde_json.workspace = true
lazy_static.workspace = true
base64.workspace = true
httpdate = "1"
p12 = "0.6"
pkcs5 = { version = "0.7", features = ["alloc", "pbes2"] }
ring = "0.17"
webpki-roots = "1"
x509-cert = { version = "0.3", default-features = false }

[dev-dependencies]
# GC and async test shims call runtime internals; production code uses only perry-ffi.
perry-runtime = { workspace = true, features = ["default", "stdlib"] }
perry-ffi = { workspace = true, features = ["runtime-link"] }
