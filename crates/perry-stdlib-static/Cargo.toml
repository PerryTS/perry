[package]
name = "perry-stdlib-static"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Staticlib wrapper (#5422): emits libperry_stdlib.a from the rlib-only perry-stdlib crate"

# Output name stays `perry_stdlib` so the produced archive is the canonical
# `libperry_stdlib.a` / `perry_stdlib.lib` every consumer already looks for.
[lints]
workspace = true

[lib]
name = "perry_stdlib"
crate-type = ["staticlib"]
path = "src/lib.rs"

[features]
# Plain build reproduces today's full `cargo build -p perry-stdlib` archive;
# auto-optimize uses `--no-default-features --features perry-stdlib/<subset>`.
default = ["perry-stdlib/default"]

[dependencies]
perry-stdlib = { path = "../perry-stdlib", default-features = false }

# Android links this archive next to libperry_ui_android.a, which bundles its
# own perry-runtime with the RegExp / Temporal / URL engines. Both copies must
# be built with the same runtime features, or the linker mixes objects from
# two different runtimes (a realm initialised without the RegExp intrinsic
# then aborts on the first regex literal).
[target.'cfg(target_os = "android")'.dependencies]
perry-runtime = { path = "../perry-runtime", default-features = false, features = ["regex-engine", "temporal", "url-engine"] }
