# `@perryts/google-auth` is no longer bundled — extracted to a
# standalone repo (https://github.com/PerryTS/google-auth) and
# published as an npm package starting v0.5.1015. The previous
# in-tree binding (perry-ext-google-auth) only shipped a
# `not-yet-implemented` stub; the standalone package carries the
# real GoogleSignIn iOS bridge + CredentialManager Android bridge.
# Users now `npm install @perryts/google-auth`; perry resolves the
# native lib through the standard `perry.nativeLibrary` lookup.
# `@perryts/pdf` — official PDF creation package (issue #516).
# Companion to the existing PdfView widget (rendering/viewing side
# already shipped in perry-ui-{ios,visionos,macos}). The producer
# side here wraps the pure-Rust `printpdf` crate behind a five-
# function FFI: createPdf / pdfAddText / pdfAddLine / pdfNewPage /
# pdfSave. Page units = PDF points (1/72"), origin = bottom-left
# per the PDF standard.
[bindings."@perryts/pdf"]
crate = "perry-ext-pdf"
lib = "perry_ext_pdf"
tracking = "#516"

# `perry/ads` — official in-app advertising package (issue #867).
# Interstitial + rewarded + banner FFI over Google Mobile Ads
# (iOS via SwiftPM, Android via play-services-ads). MVP scaffold:
# every FFI entry point resolves a structured
# `{ error: "no-sdk-linked" }` placeholder. Real SDK integration,
# GDPR/ATT consent flow, and Info.plist / AndroidManifest auto-
# injection are tracked as follow-ups under the same issue.
[bindings."perry/ads"]
crate = "perry-ext-ads"
lib = "perry_ext_ads"
tracking = "#867"

# `undici` — Node's HTTP client library, served by perry's NATIVE
# fetch/http stack instead of AOT-compiling undici's ~50k lines of JS.
# Subset binding: ProxyAgent / Agent / setGlobalDispatcher /
# getGlobalDispatcher are real; `fetch` re-uses the native Web Fetch
# lowering; `request` and the pool/mock/stream surface are not
# implemented. Targets undici's stable dispatcher API (unchanged
# across 6.x → 7.x).
[bindings.undici]
crate = "perry-ext-undici"
lib = "perry_ext_undici"
tracking = "#466"
# PARTIAL (explicit): ProxyAgent / Agent / setGlobalDispatcher /
# getGlobalDispatcher + native `fetch` are real; `request` and the
# pool/mock/stream surface are not implemented.
compat = "partial"

# Upstream provenance pin (see PR #7031 / docs upstream-pins.md). undici's
# stable dispatcher API (ProxyAgent/Agent/setGlobalDispatcher) is unchanged
# across the 6.x/7.x/8.x majors this wrapper targets; the pin tracks one
# release for provenance, not the API-compat range.
[bindings.undici.upstream]
version = "8.9.0"
sha256 = "f554abb3e9352e04bc325208066a25c229163d8408bb1d5161db3d793445d69c"
repo = "https://github.com/nodejs/undici"
ref = "21a8e1ed1843e74c3004a2926c12bb0ceaca6b71"
ported-at = "8.9.0"
date = "2026-07-30"

