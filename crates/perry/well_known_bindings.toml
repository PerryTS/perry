# `node-fetch` and the bare `fetch` alias deliberately have NO row here (P11).
#
# perry-ext-fetch defined the SAME 74 `js_fetch_*` / `js_headers_*` /
# `js_response_*` / `js_request_*` / `js_blob_*` / `js_form_data_*` symbols
# perry-stdlib owns, as a strict subset of them, and the two archives disagreed
# on how a handle is encoded: perry-stdlib NaN-boxes it with POINTER_TAG out of
# the fetch band, the wrapper returned a bare double counting from 1. A program
# that imported `node-fetch` AND called the global `fetch()` linked both (the
# flip strips `http-client`, but `compute_required_features` re-inserts
# `web-fetch`, which is the feature that actually gates the stdlib symbols), and
# whichever archive won the link decided whether the program SIGSEGV'd on
# `await fetch(...)` — `segfault at 5`, a handle id dereferenced as an object
# pointer. P8 measured it on `main` as well as on the turnloop branch.
#
# So `node-fetch` now routes to perry-stdlib's WHATWG fetch, which is a superset
# of what the wrapper implemented and which also gives node-fetch the things the
# wrapper never had: `AbortSignal` (#10325), `Content-Encoding` decoding,
# connection pooling, and P6's turnloop transport. `module_to_features` still
# maps `node-fetch` to `http-client`, which implies `web-fetch` — and with no
# row here nothing strips it, so the stdlib copy is required rather than
# optional. Restoring the two rows is all it takes to put the wrapper back.

# perry-ext-ws is Perry's own WebSocket engine, not an npm-package binding:
# it serves the global `WebSocket` client and the WebSocket hand-off of
# perry-ext-http's server. npm `ws` compiles from source (its row and upstream
# pin were removed), so the crate sits under a Perry-owned key no npm package
# can shadow. Nothing imports `perry/websocket`; the codegen symbol registry
# (`perry_codegen::ext_registry`) flips this row onto the link line whenever
# a program emits a `js_ws_*` call.
[bindings."perry/websocket"]
crate = "perry-ext-ws"
lib = "perry_ext_ws"
tracking = "#466"

