[package]
name = "perry-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LLVM code generation backend for Perry"

[lints]
workspace = true

[features]
# Compile `.ll -> .o` through the LLVM C API inside this process instead of
# shelling out to a user-supplied `clang -c`.
#
# ON BY DEFAULT. Perry links LLVM 22 statically and ships self-contained: we
# own the assumption instead of pushing it onto the user, and there is no
# "install a matching clang" step to get wrong. Building Perry therefore needs
# LLVM 22 present (`brew install llvm`, apt.llvm.org, or the official MSVC
# tarball; `LLVM_SYS_221_PREFIX` if llvm-config is not on PATH) — CI provisions
# it via `.github/actions/setup-llvm22`.
#
# It is also load-bearing rather than an optimization: the explicit statepoint
# bridge is gone (#7348), so RS4GC is the only native-root backend, and RS4GC
# needs this pipeline — an external `opt` feeding a different clang cannot
# parse the IR it emits (#7339).
#
# `--no-default-features` still builds the text path for bisection.
default = ["llvm-inprocess"]
llvm-inprocess = ["dep:inkwell", "dep:llvm-sys"]

# Test-support only (#7493): exposes `perry_codegen::testing`, whose
# `NativeRootsPin` lets a test declare WHICH root lowering it asserts on. It is
# a feature rather than a `#[doc(hidden)] pub` so that with the feature off the
# pin, its thread-local and the branch it adds to `rs4gc_enabled()` are not in
# the artifact at all — see `src/testing.rs`.
#
# The ONLY edge that enables it is the `[dev-dependencies]` entry below, which
# cargo builds for test/bench targets only. `codegen::helpers::
# testing_feature_gate_tests` fails the per-PR `cargo-test` job if any
# non-dev manifest section ever turns it on.
testing = []

[dependencies]
perry-hir.workspace = true
perry-dispatch.workspace = true
perry-api-manifest.workspace = true

anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true


# Keep these target lists aligned with `inprocess::global_init`. Inkwell's
# `target-all` default references backends Perry cannot emit and which the
# official Windows LLVM archive does not build.
[target.'cfg(not(windows))'.dependencies]
inkwell = { version = "0.9.0", default-features = false, features = ["llvm22-1", "target-x86", "target-aarch64"], optional = true }
llvm-sys = { version = "221", optional = true }

# LLVM must use the same dynamic MSVC CRT (`/MD`) as Rust on Windows. The Perry
# toolchain archive is built that way, so embed LLVM in `perry.exe` instead of
# importing LLVM-C.dll. `force-static` makes this packaging contract explicit
# and prevents llvm-config from silently selecting a shared library.
[target.'cfg(windows)'.dependencies]
inkwell = { version = "0.9.0", default-features = false, features = ["llvm22-1-force-static", "target-x86", "target-aarch64"], optional = true }
llvm-sys = { version = "221", features = ["force-static"], optional = true }

# Self dev-dependency (#7493). This is the whole mechanism by which the
# integration suites under `tests/` — which link this crate as an ordinary
# external consumer — can see `perry_codegen::testing`. Cargo supports
# dev-dependency cycles and resolves dev-dependency features ONLY when a
# test/bench target is being built, so `cargo build`/`--release`/`--profile
# dist` still compile the library with `testing` off.
[dev-dependencies]
perry-codegen = { path = ".", features = ["testing"] }
