[package]
name = "windows-future"
version = "0.3.2"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Windows async types"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[dependencies]
windows-core = { path = "../windows-core", default-features = false }
windows-link = { path = "../windows-link" }
windows-threading = { path = "../windows-threading" }

[features]
default = ["std"]
std = ["windows-core/std", "windows-threading/std"]

[package.metadata.docs.rs]
targets = []
